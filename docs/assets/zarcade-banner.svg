<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Zarcade</title>
  <desc id="d">A neon arcade marquee reading ZARCADE, with chasing bulbs, under a starry night sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0723"/>
      <stop offset="0.65" stop-color="#1a0d40"/>
      <stop offset="1" stop-color="#2c1356"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1766"/>
      <stop offset="1" stop-color="#1a0d40"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <pattern id="bulbsA" width="28" height="12" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="6" r="4" fill="#ffd35c"/>
    </pattern>
    <pattern id="bulbsB" width="28" height="12" patternUnits="userSpaceOnUse">
      <circle cx="21" cy="6" r="4" fill="#ffd35c"/>
    </pattern>
    <style>
      .chase-a { animation: chase 1.1s steps(1) infinite; }
      .chase-b { animation: chase 1.1s steps(1) infinite; animation-delay: -0.55s; }
      @keyframes chase { 0% { opacity: 1; } 50% { opacity: 0.25; } }
      .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
      .twinkle.t2 { animation-delay: -1.1s; }
      .twinkle.t3 { animation-delay: -2.2s; }
      @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      .buzz { animation: buzz 7s steps(1) infinite; }
      @keyframes buzz { 0%, 61%, 63%, 100% { opacity: 1; } 62% { opacity: 0.45; } 64% { opacity: 0.8; } }
      .comet { animation: fly 9s ease-in infinite; }
      @keyframes fly { 0%, 70% { transform: translate(0, 0); opacity: 0; } 72% { opacity: 1; } 88% { transform: translate(-520px, 150px); opacity: 0; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .chase-a, .chase-b, .twinkle, .buzz, .comet { animation: none; }
        .comet { opacity: 0; }
      }
      text { font-family: Futura, "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="twinkle" cx="70" cy="48" r="2"/>
    <circle class="twinkle t2" cx="152" cy="120" r="1.4"/>
    <circle class="twinkle t3" cx="96" cy="250" r="1.8"/>
    <circle class="twinkle" cx="208" cy="300" r="1.2"/>
    <circle class="twinkle t3" cx="1110" cy="56" r="2"/>
    <circle class="twinkle t2" cx="1040" cy="140" r="1.3"/>
    <circle class="twinkle" cx="1134" cy="236" r="1.7"/>
    <circle class="twinkle t3" cx="990" cy="318" r="1.2"/>
    <circle class="twinkle t2" cx="600" cy="22" r="1.3"/>
    <circle class="twinkle" cx="330" cy="26" r="1.1"/>
    <circle class="twinkle t2" cx="880" cy="30" r="1.5"/>
  </g>
  <!-- a four-point sparkle on each side -->
  <g fill="#5ef2ff" opacity="0.9">
    <path class="twinkle t2" d="M120 182 l5 -15 l5 15 l15 5 l-15 5 l-5 15 l-5 -15 l-15 -5 z"/>
    <path class="twinkle" d="M1068 186 l4 -12 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 z"/>
  </g>

  <!-- a little comet (Penny, from Comet Courier) streaks by now and then -->
  <g class="comet">
    <path d="M1010 40 L1100 18 L1092 34 Z" fill="#7ad1ff" opacity="0.55" filter="url(#soft)"/>
    <circle cx="1010" cy="40" r="7" fill="#ffe27a"/>
  </g>

  <!-- the marquee -->
  <rect x="210" y="40" width="780" height="270" rx="44" fill="#140a33"/>
  <rect x="222" y="52" width="756" height="246" rx="36" fill="url(#panel)" stroke="#3b2285" stroke-width="6"/>
  <!-- bulb rows sit on whole pattern tiles (multiples of 28 x 12) so no bulb is cut -->
  <rect class="chase-a" x="252" y="60" width="700" height="12" fill="url(#bulbsA)"/>
  <rect class="chase-b" x="252" y="60" width="700" height="12" fill="url(#bulbsB)"/>
  <rect class="chase-b" x="252" y="276" width="700" height="12" fill="url(#bulbsA)"/>
  <rect class="chase-a" x="252" y="276" width="700" height="12" fill="url(#bulbsB)"/>

  <text x="600" y="120" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="13" fill="#5ef2ff" filter="url(#neon)">STARLIGHT</text>
  <g class="buzz" filter="url(#neon)">
    <text x="600" y="222" text-anchor="middle" font-size="112" font-weight="800" font-style="italic" fill="#5a1d7a" transform="translate(6 7)">ZARCADE</text>
    <text x="600" y="222" text-anchor="middle" font-size="112" font-weight="800" font-style="italic" fill="#ffe9f5" stroke="#ff4fa3" stroke-width="3">ZARCADE</text>
  </g>
  <circle cx="350" cy="252" r="7" fill="#ffd35c"/>
  <text class="mono" x="612" y="258" text-anchor="middle" font-size="17" letter-spacing="4" fill="#ffd35c">FREE PLAY · ALL AGES · INSERT COIN</text>
</svg>
