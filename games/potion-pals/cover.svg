  <g stroke="#17121c" stroke-width="11" fill="none">
    <path d="M282 384 a30 30 0 0 1 22 34"/>
    <path d="M518 384 a30 30 0 0 0 -22 34"/>
  </g>
  <path d="M300 372 C286 440 330 474 400 474 C470 474 514 440 500 372 Z" fill="url(#pot)" stroke="#17121c" stroke-width="5"/>
  <!-- liquid -->
  <path d="M310 374 C300 420 344 448 400 448 C456 448 500 420 490 374 Z" fill="#4ec28a"/>
  <ellipse cx="400" cy="374" rx="86" ry="26" fill="#86e6b0"/>
  <ellipse cx="376" cy="368" rx="22" ry="7" fill="#fff" opacity="0.4"/>
  <g fill="#b8f6d4" stroke="#fff" stroke-opacity="0.55" stroke-width="2">
    <circle cx="372" cy="362" r="9"/><circle cx="414" cy="352" r="7"/><circle cx="394" cy="340" r="5"/>
  </g>
  <ellipse cx="400" cy="372" rx="100" ry="30" fill="none" stroke="#17121c" stroke-width="15"/>
  <ellipse cx="400" cy="372" rx="100" ry="30" fill="none" stroke="#4e4458" stroke-width="8"/>

  <!-- floating ingredients above the pot -->
  <g>
    <circle cx="316" cy="304" r="26" fill="#fff5dc" opacity="0.16"/>
    <circle cx="316" cy="304" r="26" fill="none" stroke="#ffeab0" stroke-width="3"/>
    <circle cx="316" cy="306" r="15" fill="#7a4fd0" stroke="#3a2a4a" stroke-width="3"/>
    <path d="M316 291 l1 -8" stroke="#3a2a4a" stroke-width="3"/>
    <ellipse cx="324" cy="288" rx="8" ry="4" fill="#5eb45e" stroke="#3a2a4a" stroke-width="2.4" transform="rotate(-28 324 288)"/>

    <circle cx="400" cy="286" r="26" fill="#fff5dc" opacity="0.16"/>
    <circle cx="400" cy="286" r="26" fill="none" stroke="#ffeab0" stroke-width="3"/>
    <path d="M400 268 l5 12 l13 1 l-10 9 l4 13 l-12 -7 l-12 7 l4 -13 l-10 -9 l13 -1 Z" fill="#ffe06a" stroke="#3a2a4a" stroke-width="2.6"/>

    <circle cx="484" cy="304" r="26" fill="#fff5dc" opacity="0.16"/>
    <circle cx="484" cy="304" r="26" fill="none" stroke="#ffeab0" stroke-width="3"/>
    <path d="M484 290 q16 16 10 22 q-5 6 -10 6 q-5 0 -10 -6 q-6 -6 10 -22 Z" fill="#ff6a2a" stroke="#3a2a4a" stroke-width="2.6"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffe68a">
    <path d="M250 338 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/>
    <path d="M548 324 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z"/>
    <path d="M466 236 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"/>
    <path d="M336 232 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z"/>
  </g>
</svg>
