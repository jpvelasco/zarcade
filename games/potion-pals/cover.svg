<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231640"/>
      <stop offset="0.6" stop-color="#3a2254"/>
      <stop offset="1" stop-color="#4a2a48"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b4356"/>
      <stop offset="0.5" stop-color="#2e2833"/>
      <stop offset="1" stop-color="#1f1925"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ef0b0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8ef0b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdc8c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffdc8c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#night)"/>

  <!-- stars and moon -->
  <g fill="#fff5d2">
    <circle cx="60" cy="54" r="2.4"/><circle cx="140" cy="30" r="1.6"/><circle cx="214" cy="72" r="2"/>
    <circle cx="300" cy="38" r="1.4"/><circle cx="392" cy="66" r="2.2"/><circle cx="470" cy="28" r="1.5"/>
    <circle cx="556" cy="60" r="1.8"/><circle cx="98" cy="120" r="1.5"/><circle cx="252" cy="134" r="1.7"/>
    <circle cx="640" cy="118" r="1.6"/><circle cx="730" cy="190" r="1.8"/><circle cx="36" cy="208" r="1.5"/>
    <circle cx="188" cy="186" r="1.3"/><circle cx="486" cy="124" r="1.4"/>
  </g>
  <circle cx="700" cy="76" r="44" fill="#ffeeb8"/>
  <circle cx="684" cy="60" r="12" fill="#fff" opacity="0.2"/>
  <circle cx="712" cy="92" r="8" fill="#fff" opacity="0.16"/>

  <!-- foliage -->
  <g fill="#20402e">
    <ellipse cx="400" cy="18" rx="430" ry="78"/>
    <ellipse cx="86" cy="96" rx="150" ry="70"/>
    <ellipse cx="716" cy="104" rx="128" ry="64"/>
  </g>
  <g fill="#2b5438">
    <ellipse cx="400" cy="4" rx="370" ry="60"/>
    <ellipse cx="96" cy="78" rx="120" ry="50"/>
    <ellipse cx="710" cy="86" rx="100" ry="44"/>
  </g>

  <!-- trunk and roots -->
  <path d="M368 40 V352 Q346 404 300 430 H500 Q454 404 432 352 V40 Z" fill="#5a3a2c" stroke="#2a1812" stroke-width="4"/>
  <g stroke="#ffd9b0" stroke-opacity="0.1" stroke-width="3" fill="none">
    <path d="M386 44 Q392 200 384 344"/><path d="M414 44 Q408 200 416 344"/>
  </g>

  <!-- rooms -->
  <g>
    <!-- left room -->
    <rect x="86" y="146" width="194" height="150" rx="14" fill="#5e4436" stroke="#1e1218" stroke-width="4"/>
    <rect x="96" y="170" width="174" height="108" rx="8" fill="#cfe8c0"/>
    <ellipse cx="183" cy="190" rx="110" ry="60" fill="url(#lamp)"/>
    <path d="M80 170 L183 136 L286 170 Z" fill="#8a4a3a" stroke="#1e1218" stroke-width="3"/>
    <rect x="96" y="278" width="174" height="16" fill="#8a5a3a"/>
    <!-- cushions and fern -->
    <ellipse cx="140" cy="268" rx="26" ry="16" fill="#d86a8a" stroke="#2a1824" stroke-width="2.5"/>
    <ellipse cx="196" cy="272" rx="20" ry="12" fill="#e8a860" stroke="#2a1824" stroke-width="2.5"/>
    <g stroke="#4a9a52" stroke-width="6" stroke-linecap="round">
      <path d="M248 272 L232 232"/><path d="M248 272 L250 226"/><path d="M248 272 L266 234"/>
    </g>
    <!-- slime pal -->
    <path d="M110 272 q-4 -40 28 -40 q32 0 28 40 q-14 8 -28 0 q-14 8 -28 0 Z" fill="#5ab85a" stroke="#2a1824" stroke-width="3"/>
    <circle cx="130" cy="252" r="4.2" fill="#2a1c2c"/><circle cx="146" cy="252" r="4.2" fill="#2a1c2c"/>
    <path d="M132 262 q6 7 12 0" stroke="#2a1824" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- right room -->
    <rect x="520" y="146" width="194" height="150" rx="14" fill="#6f4e3c" stroke="#1e1218" stroke-width="4"/>
    <rect x="530" y="170" width="174" height="108" rx="8" fill="#cfe0f4"/>
    <ellipse cx="617" cy="190" rx="110" ry="60" fill="url(#lamp)"/>
    <path d="M514 170 L617 136 L720 170 Z" fill="#8a4a3a" stroke="#1e1218" stroke-width="3"/>
    <rect x="530" y="278" width="174" height="16" fill="#8a5a3a"/>
    <!-- hammock -->
    <path d="M538 214 Q617 268 696 214 Q617 248 538 214 Z" fill="#e8d8f0" stroke="#2a1824" stroke-width="3"/>
    <!-- dragon pal -->
    <path d="M566 272 q-30 6 -24 -22" stroke="#2a1824" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M566 272 q-30 6 -24 -22" stroke="#ff6a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="596" cy="252" rx="26" ry="27" fill="#ff6a3a" stroke="#2a1824" stroke-width="3"/>
    <ellipse cx="596" cy="262" rx="14" ry="13" fill="#ffd08a"/>
    <ellipse cx="574" cy="250" rx="11" ry="8" fill="#ffd08a" stroke="#2a1824" stroke-width="2.4"/>
    <circle cx="592" cy="241" r="4" fill="#2a1c2c"/><circle cx="606" cy="241" r="4" fill="#2a1c2c"/>
    <ellipse cx="620" cy="240" rx="18" ry="9" fill="#fff" opacity="0.72" stroke="#2a1824" stroke-width="2.4" transform="rotate(-24 620 240)"/>
    <!-- cloud kitten -->
    <ellipse cx="660" cy="258" rx="24" ry="15" fill="#eaf4ff" stroke="#2a1824" stroke-width="2.6"/>
    <path d="M646 240 l6 -16 l12 10 Z M676 240 l-6 -16 l-12 10 Z" fill="#eaf4ff" stroke="#2a1824" stroke-width="2.4"/>
    <ellipse cx="661" cy="238" rx="18" ry="15" fill="#eaf4ff" stroke="#2a1824" stroke-width="2.6"/>
    <circle cx="655" cy="236" r="3.4" fill="#2a1c2c"/><circle cx="668" cy="236" r="3.4" fill="#2a1c2c"/>
    <ellipse cx="661" cy="243" rx="2.6" ry="2" fill="#ff8aa8"/>
  </g>

  <!-- hearth -->
  <path d="M0 404 Q400 380 800 404 V500 H0 Z" fill="#4a3a46"/>
  <g fill="#fff" opacity="0.07">
    <rect x="30" y="420" width="70" height="9" rx="4"/><rect x="140" y="426" width="70" height="9" rx="4"/>
    <rect x="590" y="424" width="70" height="9" rx="4"/><rect x="700" y="418" width="70" height="9" rx="4"/>
  </g>

  <!-- cauldron glow -->
  <ellipse cx="400" cy="398" rx="210" ry="120" fill="url(#glow)"/>

  <!-- fire -->
  <g>
    <path d="M362 470 q10 -40 22 -54 q12 14 22 54 Z" fill="#ff8a2a"/>
    <path d="M372 470 q8 -26 12 -34 q6 10 12 34 Z" fill="#ffe07a"/>
    <path d="M414 470 q8 -32 18 -44 q10 12 18 44 Z" fill="#ff8a2a"/>
    <path d="M422 470 q6 -20 10 -26 q5 8 10 26 Z" fill="#ffe07a"/>
