<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Pip the sprout leaping between floating islands under a sunrise">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d4a86"/>
      <stop offset="0.38" stop-color="#7fb2e8"/>
      <stop offset="0.68" stop-color="#ffc98d"/>
      <stop offset="1" stop-color="#ffe9b8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffd888" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffc46e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5637"/>
      <stop offset="1" stop-color="#4b3222"/>
    </linearGradient>
    <linearGradient id="rockFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7fb4"/>
      <stop offset="1" stop-color="#465378"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f49a"/>
      <stop offset="0.55" stop-color="#8fd45c"/>
      <stop offset="1" stop-color="#4f9e3a"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfbff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9ee6ff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- sunrise -->
  <circle cx="556" cy="286" r="210" fill="url(#sunGlow)"/>
  <circle cx="556" cy="286" r="54" fill="#fff5cf"/>
  <g stroke="#fff0bb" stroke-width="5" stroke-linecap="round" opacity="0.75">
    <path d="M556 196v-34M556 410v-34M466 286h-34M680 286h-34M492 222l-24-24M620 350l24 24M620 222l24-24M492 350l-24 24"/>
  </g>

  <!-- distant peaks -->
  <path d="M0 330 96 214l72 78 58-58 92 106 78-74 128 140 100-96 176 190v100H0z" fill="url(#rockFar)" opacity="0.55"/>
  <path d="M96 214l40 44-78 38zM348 234l38 42-74 34z" fill="#eaf4ff" opacity="0.65"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.62">
    <ellipse cx="128" cy="126" rx="44" ry="17"/><ellipse cx="164" cy="118" rx="30" ry="21"/>
    <ellipse cx="684" cy="96" rx="52" ry="18"/><ellipse cx="646" cy="90" rx="30" ry="20"/>
    <ellipse cx="404" cy="70" rx="38" ry="14"/>
  </g>

  <!-- back floating island with a waterfall -->
  <g>
    <ellipse cx="640" cy="404" rx="116" ry="26" fill="#5a3d28"/>
    <path d="M524 404c24 70 66 96 116 96s92-26 116-96z" fill="url(#rock)"/>
    <ellipse cx="640" cy="396" rx="116" ry="24" fill="#3f8d63"/>
    <ellipse cx="640" cy="390" rx="110" ry="20" fill="#63c96b"/>
    <path d="M610 400h34l-6 100h-22z" fill="url(#fall)"/>
    <g fill="#2f7a52">
      <path d="M560 388q6-22 16-26 6 18-2 28z"/><path d="M714 386q8-20 18-22 4 16-4 26z"/>
    </g>
  </g>

  <!-- main island, left -->
  <g>
    <ellipse cx="164" cy="372" rx="150" ry="34" fill="#5a3d28"/>
    <path d="M14 372c22 86 70 128 150 128s128-42 150-128z" fill="url(#rock)"/>
    <path d="M60 400q30 34 66 40-40 8-76-18z" fill="#3a2718" opacity="0.5"/>
    <ellipse cx="164" cy="362" rx="150" ry="30" fill="#3f8d63"/>
    <ellipse cx="164" cy="354" rx="142" ry="25" fill="#63c96b"/>
    <!-- mushroom -->
    <rect x="98" y="322" width="16" height="30" rx="7" fill="#f6e7d0"/>
    <path d="M70 326a36 26 0 0 1 72 0z" fill="#ff6f91"/>
    <circle cx="88" cy="314" r="6" fill="#fff1f6"/><circle cx="118" cy="309" r="4" fill="#fff1f6"/>
    <!-- bloomed checkpoint flower -->
    <path d="M232 352v-34" stroke="#4f9e57" stroke-width="6" stroke-linecap="round"/>
    <g fill="#ff8fc0"><circle cx="232" cy="306" r="9"/><circle cx="215" cy="316" r="9"/><circle cx="249" cy="316" r="9"/><circle cx="222" cy="332" r="9"/><circle cx="242" cy="332" r="9"/></g>
    <circle cx="232" cy="319" r="8" fill="#ffe680"/>
    <!-- beetle -->
    <g transform="translate(288 336)">
      <ellipse cx="0" cy="0" rx="20" ry="15" fill="#c4703a"/>
      <path d="M-20 -2a20 15 0 0 1 40 0z" fill="#8f4a22"/>
      <path d="M0 -15v28" stroke="#5e2f14" stroke-width="2"/>
      <circle cx="13" cy="-3" r="4.5" fill="#fff"/><circle cx="15" cy="-3" r="2.2" fill="#23180f"/>
      <path d="M12 -12l7-8" stroke="#4a3320" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- small stepping island -->
  <g>
    <ellipse cx="404" cy="290" rx="72" ry="18" fill="#5a3d28"/>
    <path d="M332 290c12 44 34 62 72 62s60-18 72-62z" fill="url(#rock)"/>
    <ellipse cx="404" cy="282" rx="72" ry="16" fill="#3f8d63"/>
    <ellipse cx="404" cy="276" rx="66" ry="13" fill="#63c96b"/>
    <!-- golden acorn -->
    <g transform="translate(404 238)">
      <ellipse cx="0" cy="4" rx="13" ry="16" fill="#f4b73f"/>
      <rect x="-14" y="-13" width="28" height="14" rx="5" fill="#8a5a22"/>
      <rect x="-2" y="-21" width="4" height="9" rx="2" fill="#6d4318"/>
      <circle cx="-5" cy="2" r="3" fill="#ffe9a8" opacity="0.8"/>
    </g>
  </g>

  <!-- seeds along the jump arc -->
  <g fill="#ffd45e">
    <ellipse cx="292" cy="258" rx="7" ry="10"/><ellipse cx="322" cy="220" rx="7" ry="10"/>
    <ellipse cx="358" cy="196" rx="7" ry="10"/><ellipse cx="470" cy="206" rx="7" ry="10"/>
    <ellipse cx="506" cy="232" rx="7" ry="10"/>
  </g>
  <g fill="#fff6cf" opacity="0.85">
    <ellipse cx="290" cy="254" rx="2.4" ry="3.6"/><ellipse cx="320" cy="216" rx="2.4" ry="3.6"/>
    <ellipse cx="356" cy="192" rx="2.4" ry="3.6"/><ellipse cx="468" cy="202" rx="2.4" ry="3.6"/>
    <ellipse cx="504" cy="228" rx="2.4" ry="3.6"/>
  </g>

  <!-- Pip, mid leap -->
  <g transform="translate(410 150) rotate(-8)">
    <ellipse cx="0" cy="70" rx="30" ry="8" fill="#1d2f22" opacity="0.18"/>
    <!-- dust puffs behind -->
    <g fill="#ffffff" opacity="0.5">
      <circle cx="-54" cy="46" r="10"/><circle cx="-72" cy="58" r="7"/><circle cx="-38" cy="58" r="6"/>
    </g>
    <!-- feet -->
    <ellipse cx="-11" cy="44" rx="9" ry="6" fill="#e8b866"/>
    <ellipse cx="11" cy="48" rx="9" ry="6" fill="#e8b866"/>
    <!-- body -->
    <path d="M-30 30q-8-54 30-58 38 4 30 58Q0 48-30 30z" fill="url(#body)"/>
    <!-- leaf arms -->
    <ellipse cx="-34" cy="4" rx="14" ry="7" fill="#6fc24d" transform="rotate(-38 -34 4)"/>
    <ellipse cx="34" cy="-4" rx="14" ry="7" fill="#6fc24d" transform="rotate(34 34 -4)"/>
    <!-- sprout -->
    <path d="M0 -30v-16" stroke="#4f9e3a" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-12" cy="-50" rx="13" ry="7" fill="#7ed957" transform="rotate(-34 -12 -50)"/>
    <ellipse cx="13" cy="-56" rx="12" ry="6.5" fill="#a8e86a" transform="rotate(32 13 -56)"/>
    <!-- face -->
    <ellipse cx="-9" cy="-4" rx="7" ry="8.5" fill="#fffdf4"/>
    <ellipse cx="10" cy="-4" rx="7" ry="8.5" fill="#fffdf4"/>
    <circle cx="-7.5" cy="-3" r="3.6" fill="#2a3d22"/>
    <circle cx="11.5" cy="-3" r="3.6" fill="#2a3d22"/>
    <circle cx="-9" cy="-5.6" r="1.5" fill="#fff"/><circle cx="10" cy="-5.6" r="1.5" fill="#fff"/>
    <ellipse cx="-17" cy="8" rx="5.5" ry="3.4" fill="#ff96aa" opacity="0.55"/>
    <ellipse cx="18" cy="8" rx="5.5" ry="3.4" fill="#ff96aa" opacity="0.55"/>
    <path d="M-5 9q6 7 12 0" stroke="#2a3d22" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- foreground grass blades -->
  <g fill="#2f7a52">
    <path d="M0 500q26-58 46-70-6 44-20 70z"/>
    <path d="M760 500q22-64 40-78-4 48-16 78z"/>
  </g>
  <!-- sparkles -->
  <g stroke="#fff6cf" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M214 150v18M205 159h18"/>
    <path d="M700 250v14M693 257h14"/>
    <path d="M120 232v12M114 238h12"/>
  </g>
</svg>
