<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc0ff"/>
      <stop offset="0.7" stop-color="#a8e6ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset="1" stop-color="#d9561a"/>
    </radialGradient>
    <radialGradient id="flame" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#fff2a0"/>
      <stop offset="0.5" stop-color="#ffa63a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff4a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2554a"/>
      <stop offset="1" stop-color="#c8402f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.95">
    <circle cx="110" cy="80" r="30"/><circle cx="145" cy="72" r="38"/><circle cx="185" cy="86" r="28"/>
    <circle cx="620" cy="60" r="22"/><circle cx="648" cy="52" r="30"/><circle cx="680" cy="64" r="22"/>
  </g>
  <path d="M0 290 Q200 250 400 285 T800 280 V340 H0 Z" fill="#8fd37a"/>
