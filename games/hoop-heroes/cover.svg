    <path d="M-60 140 Q-60 40 2 40 Q64 40 64 140 Z" fill="#ff8fb8"/>
    <circle cx="2" cy="0" r="44" fill="#f6f1f7"/>
    <circle cx="-14" cy="-6" r="8" fill="#fff"/><circle cx="18" cy="-6" r="8" fill="#fff"/>
    <circle cx="-12" cy="-4" r="5" fill="#1b1530"/><circle cx="20" cy="-4" r="5" fill="#1b1530"/>
    <ellipse cx="2" cy="12" rx="6" ry="4" fill="#ff7fa8"/>
    <path d="M-6 20 Q2 28 10 20" stroke="#5a3040" stroke-width="3" fill="none"/>
