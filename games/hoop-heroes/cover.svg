  <rect y="365" width="800" height="8" fill="#fff"/>
  <!-- hoop -->
  <rect x="392" y="190" width="16" height="180" fill="#2f6fd6"/>
  <rect x="300" y="70" width="200" height="130" rx="6" fill="#fff" stroke="#e2554a" stroke-width="9"/>
  <rect x="362" y="118" width="76" height="58" fill="none" stroke="#e2554a" stroke-width="6"/>
  <path d="M352 188 L366 250 H434 L448 188" fill="none" stroke="#fff" stroke-width="4"/>
  <path d="M352 188 L380 250 M370 188 L398 250 M390 188 L410 250 M410 188 L392 250 M430 188 L402 250 M448 188 L420 250 M362 220 H438" stroke="#fff" stroke-width="3" fill="none"/>
