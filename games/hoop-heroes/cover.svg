    <path d="M22 10 Q60 22 98 10 V20 Q60 32 22 20 Z" fill="#2f6fd6"/>
    <path d="M106 70 Q140 20 150 -10" stroke="#e9b77a" stroke-width="20" stroke-linecap="round" fill="none"/>
