<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0730"/>
      <stop offset="0.6" stop-color="#2a0d5e"/>
      <stop offset="1" stop-color="#4a1266"/>
    </linearGradient>
    <radialGradient id="neb1" cx="0.2" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.85" cy="0.7" r="0.55">
      <stop offset="0" stop-color="#2fd3ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2fd3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#a33d2a"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c3c9ef"/>
      <stop offset="1" stop-color="#4a4d7c"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0"/>
      <stop offset="1" stop-color="#8ff6ff" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="home" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#2a8fb0"/>
      <stop offset="1" stop-color="#0c1838"/>
    </radialGradient>
    <radialGradient id="glow" r="0.5">
      <stop offset="0" stop-color="#5ef2ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5ef2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a99ee0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <rect width="800" height="500" fill="url(#neb1)"/>
  <rect width="800" height="500" fill="url(#neb2)"/>
  <g fill="#fff">
    <circle cx="60" cy="60" r="1.6"/><circle cx="150" cy="130" r="1.1"/><circle cx="250" cy="40" r="1.4"/>
    <circle cx="420" cy="90" r="1.2"/><circle cx="560" cy="30" r="1.8"/><circle cx="700" cy="110" r="1.3"/>
    <circle cx="760" cy="40" r="1"/><circle cx="90" cy="240" r="1.2"/><circle cx="640" cy="230" r="1.5"/>
    <circle cx="350" cy="200" r="1"/><circle cx="500" cy="170" r="1.2"/><circle cx="30" cy="330" r="1.4"/>
    <circle cx="770" cy="300" r="1.1"/>
  </g>
  <!-- home planet horizon -->
  <ellipse cx="400" cy="640" rx="560" ry="250" fill="url(#home)"/>
  <ellipse cx="400" cy="640" rx="560" ry="250" fill="none" stroke="#5ef2ff" stroke-width="5" opacity="0.6"/>
  <!-- ringed planet with a face -->
  <g transform="translate(250 220) rotate(-18)">
    <path d="M -170 0 A 170 40 0 0 1 170 0" fill="none" stroke="#ffe1a0" stroke-width="12"/>
    <circle r="96" fill="url(#planet)"/>
    <ellipse cx="-30" cy="-6" rx="7" ry="11" fill="#3a1020"/>
    <ellipse cx="30" cy="-6" rx="7" ry="11" fill="#3a1020"/>
    <path d="M -26 16 Q 0 42 26 16" fill="none" stroke="#3a1020" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-50" cy="18" r="10" fill="#ff6e96" opacity="0.5"/>
    <circle cx="50" cy="18" r="10" fill="#ff6e96" opacity="0.5"/>
    <path d="M -170 0 A 170 40 0 0 0 170 0" fill="none" stroke="#ffe1a0" stroke-width="12"/>
  </g>
  <!-- little planets -->
  <circle cx="660" cy="90" r="34" fill="#4fb8ff"/>
  <circle cx="650" cy="80" r="12" fill="#bfe6ff" opacity="0.5"/>
  <circle cx="560" cy="250" r="18" fill="#ff6b4a"/>
  <circle cx="90" cy="420" r="14" fill="#ff7ad9" opacity="0.9"/>
  <!-- the black hole -->
  <g transform="translate(700 260)">
    <ellipse rx="56" ry="20" fill="none" stroke="#ffb347" stroke-width="5" opacity="0.8"/>
    <ellipse rx="40" ry="13" fill="none" stroke="#b28cff" stroke-width="4" opacity="0.8"/>
    <circle r="16" fill="#000" stroke="#ffd08a" stroke-width="2"/>
  </g>
  <!-- flippers -->
  <g transform="translate(250 430) rotate(22)">
    <path d="M 0 -18 L 150 -8 A 8 8 0 0 1 150 8 L 0 18 A 18 18 0 0 1 0 -18 Z" fill="url(#flip)" stroke="#ff4fd8" stroke-width="5"/>
    <circle r="7" fill="#5a3fb0"/>
  </g>
  <g transform="translate(550 430) rotate(158)">
    <path d="M 0 -18 L 150 -8 A 8 8 0 0 1 150 8 L 0 18 A 18 18 0 0 1 0 -18 Z" fill="url(#flip)" stroke="#ff4fd8" stroke-width="5"/>
    <circle r="7" fill="#5a3fb0"/>
  </g>
  <!-- the ball, flying up with a comet tail -->
  <circle cx="470" cy="300" r="60" fill="url(#glow)"/>
  <path d="M 340 440 L 455 288 L 485 312 Z" fill="url(#tail)"/>
  <circle cx="470" cy="300" r="26" fill="url(#ball)"/>
  <ellipse cx="462" cy="290" rx="7" ry="4" fill="#fff" transform="rotate(-30 462 290)"/>
  <!-- sparks -->
  <g stroke="#ffe7a8" stroke-width="4" stroke-linecap="round">
    <path d="M 410 400 l -14 -8"/><path d="M 420 390 l -6 -16"/><path d="M 432 404 l 12 -10"/>
  </g>
</svg>
