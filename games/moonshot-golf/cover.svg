<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="sky" cx="72%" cy="22%" r="95%">
      <stop offset="0" stop-color="#3a1f86"/>
      <stop offset="0.5" stop-color="#1c1152"/>
      <stop offset="1" stop-color="#0a0726"/>
    </radialGradient>
    <radialGradient id="neb1" cx="20%" cy="75%" r="45%">
      <stop offset="0" stop-color="#ff5d8f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff5d8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="55%" cy="35%" r="40%">
      <stop offset="0" stop-color="#7de3ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7de3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saturn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c0"/>
      <stop offset="0.5" stop-color="#f3b561"/>
      <stop offset="1" stop-color="#b8662f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d2ff"/>
      <stop offset="1" stop-color="#9a8cf2"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a47b8"/>
      <stop offset="1" stop-color="#2c1f72"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fff7c9"/>
      <stop offset="1" stop-color="#ffc93d"/>
    </radialGradient>
    <radialGradient id="glow" r="50%">
      <stop offset="0" stop-color="#fff5aa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff5aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cup" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#05030f"/>
      <stop offset="1" stop-color="#3a2d63"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f4f4ff"/>
      <stop offset="1" stop-color="#8c90c9"/>
    </radialGradient>
    <radialGradient id="mars" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffc49a"/>
      <stop offset="1" stop-color="#c4502c"/>
    </radialGradient>
    <radialGradient id="portal" r="50%">
      <stop offset="0" stop-color="#7df3ff" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#1a0b50" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0b50" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bump" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffd0ea"/>
      <stop offset="1" stop-color="#e03a8c"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <rect width="800" height="500" fill="url(#neb1)"/>
  <rect width="800" height="500" fill="url(#neb2)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="40" cy="40" r="1.6"/><circle cx="120" cy="90" r="1"/><circle cx="210" cy="30" r="1.4"/><circle cx="300" cy="70" r="1"/>
    <circle cx="380" cy="24" r="1.8"/><circle cx="460" cy="60" r="1"/><circle cx="90" cy="180" r="1.2"/><circle cx="30" cy="260" r="1"/>
    <circle cx="170" cy="150" r="1"/><circle cx="520" cy="110" r="1.2"/><circle cx="760" cy="300" r="1.4"/><circle cx="720" cy="440" r="1"/>
    <circle cx="610" cy="470" r="1.3"/><circle cx="60" cy="460" r="1.4"/><circle cx="250" cy="480" r="1"/><circle cx="780" cy="200" r="1"/>
    <circle cx="350" cy="140" r="0.9"/><circle cx="140" cy="330" r="1"/><circle cx="700" cy="250" r="0.9"/><circle cx="440" cy="480" r="1.1"/>
  </g>
  <g stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M250 110v12M244 116h12"/><path d="M660 380v14M653 387h14"/><path d="M70 110v10M65 115h10"/>
  </g>

  <!-- Saturn -->
  <g transform="translate(640 120) rotate(-16)">
    <ellipse rx="160" ry="34" fill="none" stroke="#ffe0a0" stroke-width="12" stroke-opacity="0.45"/>
    <circle r="78" fill="url(#saturn)"/>
    <clipPath id="sc"><circle r="78"/></clipPath>
    <g opacity="0.25" fill="#fff" clip-path="url(#sc)"><rect x="-80" y="-44" width="160" height="10"/><rect x="-80" y="-12" width="160" height="8"/><rect x="-80" y="22" width="160" height="10"/></g>
    <path d="M-160 0a160 34 0 0 0 320 0" fill="none" stroke="#fff0c8" stroke-width="12" stroke-linecap="round"/>
    <path d="M-178 4a178 40 0 0 0 356 0" fill="none" stroke="#ffcf8a" stroke-width="4" stroke-opacity="0.6"/>
  </g>

  <!-- little moon and mars -->
  <circle cx="90" cy="120" r="34" fill="url(#moon)"/>
  <circle cx="80" cy="110" r="7" fill="#a7acd9"/><circle cx="102" cy="132" r="9" fill="#a7acd9"/><circle cx="98" cy="102" r="4" fill="#a7acd9"/>
  <circle cx="740" cy="410" r="22" fill="url(#mars)"/>
  <path d="M722 404q18 6 36 0" stroke="#a3492b" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- floating island course -->
  <g filter="url(#soft)">
    <path d="M150 300 L470 210 L700 300 L380 420 Z" fill="url(#side)" transform="translate(0 30)"/>
    <path d="M150 300 L470 210 L700 300 L380 420 Z" fill="url(#side)" transform="translate(0 18)"/>
    <path d="M150 300 L470 210 L700 300 L380 420 Z" fill="url(#floor)"/>
  </g>
  <!-- floor texture rings -->
  <g fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="6">
    <path d="M230 300 Q420 250 600 300"/><path d="M260 325 Q420 280 580 322"/><path d="M300 350 Q420 312 540 346"/>
  </g>
  <!-- ice strip -->
  <path d="M520 262 L600 262 L640 285 L560 288 Z" fill="#dff6ff" opacity="0.7"/>
  <!-- walls -->
  <path d="M150 300 L470 210 L700 300 L380 420 Z" fill="none" stroke="#5a47b8" stroke-width="14" stroke-linejoin="round" transform="translate(0 4)"/>
  <path d="M150 300 L470 210 L700 300 L380 420 Z" fill="none" stroke="#fff6d6" stroke-width="11" stroke-linejoin="round"/>
  <path d="M150 300 L470 210 L700 300 L380 420 Z" fill="none" stroke="#ffd35a" stroke-width="3" stroke-linejoin="round" opacity="0.8"/>

  <!-- black hole swirl -->
  <g transform="translate(415 330)">
    <ellipse rx="54" ry="24" fill="#1a0b40" opacity="0.55"/>
    <path d="M-44 0a44 18 0 0 1 60 -14" fill="none" stroke="#ff9ad6" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M40 2a40 16 0 0 1 -58 14" fill="none" stroke="#9ad4ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <ellipse rx="12" ry="6" fill="#000"/>
    <ellipse rx="14" ry="7.5" fill="none" stroke="#ffbe78" stroke-width="2.5"/>
  </g>

  <!-- bumpers -->
  <g>
    <ellipse cx="520" cy="310" rx="20" ry="13" fill="#2c1f72" opacity="0.5" transform="translate(3 6)"/>
    <ellipse cx="520" cy="310" rx="20" ry="13" fill="url(#bump)" stroke="#fff2fa" stroke-width="3"/>
    <path d="M520 302l2.4 5 5.4.6-4 3.6 1.2 5.2-5-2.8-5 2.8 1.2-5.2-4-3.6 5.4-.6z" fill="#fff6d6"/>
    <ellipse cx="300" cy="280" rx="17" ry="11" fill="#2c1f72" opacity="0.5" transform="translate(3 6)"/>
    <ellipse cx="300" cy="280" rx="17" ry="11" fill="url(#bump)" stroke="#fff2fa" stroke-width="3"/>
  </g>

  <!-- portal -->
  <g transform="translate(250 318)">
    <ellipse rx="26" ry="13" fill="url(#portal)"/>
    <ellipse rx="22" ry="11" fill="none" stroke="#7df3ff" stroke-width="3.5" stroke-dasharray="40 14"/>
    <ellipse rx="14" ry="7" fill="none" stroke="#7df3ff" stroke-width="2.5" stroke-dasharray="20 10" opacity="0.7"/>
  </g>

  <!-- cup and flag -->
  <ellipse cx="600" cy="302" rx="24" ry="12" fill="#fff" opacity="0.5"/>
  <ellipse cx="600" cy="302" rx="19" ry="9.5" fill="url(#cup)"/>
  <line x1="600" y1="302" x2="600" y2="200" stroke="#f5f2ff" stroke-width="5" stroke-linecap="round"/>
  <path d="M600 202 Q630 214 656 206 L646 226 Q626 232 600 232 Z" fill="#ff5d8f"/>
  <path d="M600 202 Q630 214 656 206" fill="none" stroke="#ffb3cb" stroke-width="3" stroke-linecap="round"/>
  <circle cx="600" cy="200" r="5.5" fill="#fff"/>

  <!-- ball flight: dotted trail from the tee -->
  <g fill="#fff5aa">
    <circle cx="206" cy="336" r="3.5" opacity="0.35"/><circle cx="232" cy="345" r="3.8" opacity="0.4"/>
    <circle cx="300" cy="350" r="4" opacity="0.5"/><circle cx="340" cy="346" r="4.2" opacity="0.55"/>
    <circle cx="378" cy="336" r="4.4" opacity="0.6"/><circle cx="414" cy="322" r="4.6" opacity="0.65"/>
    <circle cx="448" cy="306" r="4.8" opacity="0.72"/>
  </g>
  <circle cx="486" cy="292" r="46" fill="url(#glow)"/>
  <ellipse cx="489" cy="302" rx="12" ry="5" fill="#2c1f72" opacity="0.4"/>
  <circle cx="486" cy="290" r="13" fill="url(#ball)"/>

  <!-- sparkles -->
  <g fill="#ffd35a">
    <path d="M540 170l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path d="M330 200l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#7de3ff"/>
    <path d="M690 250l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#ff9ad6"/>
  </g>

  <!-- rocket streak -->
  <g transform="translate(150 220) rotate(-24)">
    <path d="M-60 0h40" stroke="#ff8a3d" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M-44 0h24" stroke="#ffe38a" stroke-width="4" stroke-linecap="round"/>
    <path d="M-18 -9h26q14 9 0 18h-26z" fill="#f5f2ff"/>
    <circle cx="4" cy="0" r="4" fill="#7de3ff"/>
    <path d="M-18 -9l-8 -7v7zM-18 9l-8 7v-7z" fill="#ff5d8f"/>
  </g>
</svg>
