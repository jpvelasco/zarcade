<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14183c"/>
      <stop offset="0.55" stop-color="#3a3a8a"/>
      <stop offset="1" stop-color="#ff9a6a"/>
    </linearGradient>
    <radialGradient id="sea" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#1a4ab0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#7ac8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7ac8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a5a"/>
      <stop offset="1" stop-color="#2a2a34"/>
