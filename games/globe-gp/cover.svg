        <rect x="17" y="17.5" width="14" height="13.5"/><rect x="45" y="17.5" width="14" height="13.5"/><rect x="73" y="17.5" width="14" height="13.5"/>
        <rect x="3" y="31" width="14" height="13.5"/><rect x="31" y="31" width="14" height="13.5"/><rect x="59" y="31" width="14" height="13.5"/>
        <rect x="17" y="44.5" width="14" height="13.5"/><rect x="45" y="44.5" width="14" height="13.5"/><rect x="73" y="44.5" width="14" height="13.5"/>
