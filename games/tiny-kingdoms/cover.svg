<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd6e0"/>
      <stop offset="1" stop-color="#2f8cb8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="soldierB">
      <ellipse cx="0" cy="9" rx="8" ry="2.6" fill="#1e3020" opacity="0.25"/>
      <circle r="8.5" fill="#3d7fe0" stroke="#3b2c22" stroke-width="2"/>
      <path d="M-8 -1 A8.5 8.5 0 0 1 8 -1 Z" fill="#cfd6e0" stroke="#3b2c22" stroke-width="2"/>
      <circle cx="-2.8" cy="2" r="1.2" fill="#3b2c22"/><circle cx="2.8" cy="2" r="1.2" fill="#3b2c22"/>
    </g>
    <g id="soldierR">
      <ellipse cx="0" cy="9" rx="8" ry="2.6" fill="#1e3020" opacity="0.25"/>
      <circle r="8.5" fill="#e2483d" stroke="#3b2c22" stroke-width="2"/>
      <path d="M-8 -1 A8.5 8.5 0 0 1 8 -1 Z" fill="#cfd6e0" stroke="#3b2c22" stroke-width="2"/>
      <circle cx="-2.8" cy="2" r="1.2" fill="#3b2c22"/><circle cx="2.8" cy="2" r="1.2" fill="#3b2c22"/>
    </g>
    <g id="island">
      <ellipse cx="0" cy="6" rx="128" ry="74" fill="#a8eee6" opacity="0.55"/>
      <ellipse cx="0" cy="4" rx="114" ry="64" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="0" cy="10" rx="108" ry="60" fill="#d7b878"/>
      <ellipse cx="0" cy="2" rx="108" ry="60" fill="#f4e0a6"/>
      <ellipse cx="0" cy="2" rx="94" ry="50" fill="#5ea845"/>
      <ellipse cx="0" cy="-3" rx="94" ry="50" fill="#83cc5c"/>
      <ellipse cx="-22" cy="-16" rx="54" ry="26" fill="#b2e481" opacity="0.5"/>
    </g>
    <g id="tree">
      <ellipse cx="0" cy="3" rx="12" ry="4" fill="#1e3020" opacity="0.22"/>
      <rect x="-2.5" y="-9" width="5" height="12" fill="#7a5235" stroke="#3b2c22" stroke-width="1.5"/>
      <circle cy="-17" r="11" fill="#3f9a4a" stroke="#3b2c22" stroke-width="1.8"/>
      <circle cx="-4" cy="-21" r="4" fill="#ffffff" opacity="0.25"/>
    </g>
  </defs>
  <rect width="800" height="500" fill="url(#sea)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M60 300 q10 -6 20 0 q10 -6 20 0"/><path d="M380 440 q10 -6 20 0 q10 -6 20 0"/>
    <path d="M700 120 q10 -6 20 0 q10 -6 20 0"/><path d="M360 110 q10 -6 20 0 q10 -6 20 0"/>
    <path d="M610 460 q10 -6 20 0 q10 -6 20 0"/><path d="M80 470 q10 -6 20 0 q10 -6 20 0"/>
  </g>

  <!-- Left island with the blue castle -->
  <use href="#island" transform="translate(170 300) scale(1.25)"/>
  <!-- Right island with the red castle -->
  <use href="#island" transform="translate(640 210) scale(1.15)"/>
  <!-- Little middle island with a windmill -->
  <use href="#island" transform="translate(420 395) scale(0.62)"/>

  <use href="#tree" transform="translate(70 300)"/>
  <use href="#tree" transform="translate(250 360) scale(0.9)"/>
  <use href="#tree" transform="translate(730 190) scale(0.9)"/>
  <use href="#tree" transform="translate(560 250)"/>
  <g fill="#ffffff"><circle cx="110" cy="345" r="3"/><circle cx="122" cy="352" r="3"/><circle cx="680" cy="262" r="3"/><circle cx="694" cy="255" r="3"/></g>
  <g fill="#ffe066"><circle cx="116" cy="340" r="2.5"/><circle cx="688" cy="268" r="2.5"/></g>

