    <ellipse cx="0" cy="14" rx="72" ry="13" fill="#1e3020" opacity="0.2" stroke="none"/>
    <rect x="-46" y="-56" width="92" height="70" fill="#efe6d4"/>
    <rect x="-66" y="-76" width="32" height="90" fill="#efe6d4"/>
    <rect x="34" y="-76" width="32" height="90" fill="#efe6d4"/>
    <path d="M-72 -76 L-50 -122 L-28 -76 Z" fill="#3d7fe0"/>
    <path d="M28 -76 L50 -122 L72 -76 Z" fill="#3d7fe0"/>
    <rect x="-22" y="-98" width="44" height="112" fill="#efe6d4"/>
    <path d="M-26 -98 h10 v-10 h10 v10 h12 v-10 h10 v10 h10" fill="none"/>
    <path d="M-12 14 V-8 A12 12 0 0 1 12 -8 V14 Z" fill="#5e3d25"/>
    <path d="M-14 -88 H14 V-56 L0 -64 L-14 -56 Z" fill="#3d7fe0"/>
    <path d="M-8 -70 V-82 L-4 -76 L0 -86 L4 -76 L8 -82 V-70 Z" fill="#fff8e8" stroke-width="1.5"/>
    <line x1="0" y1="-108" x2="0" y2="-140"/>
    <path d="M0 -140 Q14 -146 28 -138 L24 -131 L28 -124 Q14 -130 0 -124 Z" fill="#3d7fe0"/>
  </g>
  <g transform="translate(170 330)">
    <rect x="-28" y="0" width="56" height="30" rx="15" fill="#3d7fe0" stroke="#3b2c22" stroke-width="3"/>
    <text x="0" y="23" text-anchor="middle" font-family="ui-rounded, system-ui, sans-serif" font-weight="900" font-size="22" fill="#ffffff">42</text>
  </g>

  <!-- Red castle -->
  <g transform="translate(640 205) scale(0.85)" stroke="#3b2c22" stroke-width="3" stroke-linejoin="round">
    <ellipse cx="0" cy="14" rx="72" ry="13" fill="#1e3020" opacity="0.2" stroke="none"/>
    <rect x="-46" y="-56" width="92" height="70" fill="#efe6d4"/>
    <rect x="-66" y="-76" width="32" height="90" fill="#efe6d4"/>
    <rect x="34" y="-76" width="32" height="90" fill="#efe6d4"/>
    <path d="M-72 -76 L-50 -122 L-28 -76 Z" fill="#e2483d"/>
    <path d="M28 -76 L50 -122 L72 -76 Z" fill="#e2483d"/>
    <rect x="-22" y="-98" width="44" height="112" fill="#efe6d4"/>
    <path d="M-12 14 V-8 A12 12 0 0 1 12 -8 V14 Z" fill="#5e3d25"/>
    <path d="M-14 -88 H14 V-56 L0 -64 L-14 -56 Z" fill="#e2483d"/>
    <line x1="0" y1="-98" x2="0" y2="-130"/>
    <path d="M0 -130 Q14 -136 28 -128 L24 -121 L28 -114 Q14 -120 0 -114 Z" fill="#e2483d"/>
  </g>
  <g transform="translate(640 228)">
    <rect x="-24" y="0" width="48" height="27" rx="13.5" fill="#e2483d" stroke="#3b2c22" stroke-width="3"/>
    <text x="0" y="21" text-anchor="middle" font-family="ui-rounded, system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff">18</text>
  </g>

  <!-- Windmill -->
  <g transform="translate(420 392)" stroke="#3b2c22" stroke-width="2.5" stroke-linejoin="round">
    <path d="M-17 10 L17 10 L12 -38 L-12 -38 Z" fill="#fff6e2"/>
    <path d="M-16 -36 Q0 -62 16 -36 Z" fill="#bdb5a6"/>
    <g transform="translate(0 -40) rotate(20)" fill="#fbf3df">
      <rect x="2" y="-4" width="34" height="8"/><rect x="-36" y="-4" width="34" height="8"/>
      <rect x="-4" y="2" width="8" height="34"/><rect x="-4" y="-36" width="8" height="34"/>
      <circle r="4" fill="#7b7365"/>
    </g>
  </g>
  <g transform="translate(420 410)">
    <rect x="-20" y="0" width="40" height="24" rx="12" fill="#f6f1e6" stroke="#8a8170" stroke-width="2.5"/>
    <text x="0" y="18.5" text-anchor="middle" font-family="ui-rounded, system-ui, sans-serif" font-weight="900" font-size="17" fill="#4a4236">12</text>
  </g>

  <!-- Marching line and squads -->
  <path d="M250 300 L560 225" stroke="#3d7fe0" stroke-width="5" stroke-dasharray="6 12" stroke-linecap="round" opacity="0.7"/>
  <path d="M580 250 L470 370" stroke="#e2483d" stroke-width="5" stroke-dasharray="6 12" stroke-linecap="round" opacity="0.6"/>
  <!-- Blue boat squad on the water -->
  <g transform="translate(395 262)" stroke="#3b2c22" stroke-width="2.5" stroke-linejoin="round">
    <ellipse cx="0" cy="16" rx="36" ry="6" fill="#ffffff" opacity="0.5" stroke="none"/>
    <path d="M-34 0 H34 Q30 14 18 14 H-18 Q-30 14 -34 0 Z" fill="#9a6a43"/>
    <line x1="0" y1="0" x2="0" y2="-44"/>
    <path d="M2 -42 Q26 -28 24 -6 H2 Z" fill="#3d7fe0"/>
    <use href="#soldierB" transform="translate(-20 -4)"/><use href="#soldierB" transform="translate(-6 -6)"/><use href="#soldierB" transform="translate(18 -5)"/>
  </g>
  <g transform="translate(395 196)">
    <rect x="-20" y="0" width="40" height="24" rx="12" fill="#1f4f9e" stroke="#fff8e8" stroke-width="2"/>
    <text x="0" y="18" text-anchor="middle" font-family="ui-rounded, system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff">21</text>
  </g>
  <!-- Blue soldiers leaving the castle -->
  <use href="#soldierB" transform="translate(262 300)"/><use href="#soldierB" transform="translate(276 290)"/>
  <use href="#soldierB" transform="translate(268 312)"/><use href="#soldierB" transform="translate(284 302)"/>
  <!-- Red soldiers marching on the right island -->
  <use href="#soldierR" transform="translate(560 270)"/><use href="#soldierR" transform="translate(548 282)"/>
  <use href="#soldierR" transform="translate(572 284)"/><use href="#soldierR" transform="translate(560 296)"/>
