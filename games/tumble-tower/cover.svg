    <ellipse cx="148" cy="10" rx="20" ry="12" fill="#fff0b8"/>
    <ellipse cx="108" cy="-6" rx="5" ry="6.5" fill="#1d1a2c"/><ellipse cx="130" cy="-6" rx="5" ry="6.5" fill="#1d1a2c"/>
