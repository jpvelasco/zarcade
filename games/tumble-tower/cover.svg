  <g transform="translate(392 270) rotate(-3)">
    <ellipse cx="-92" cy="18" rx="16" ry="8" fill="#9be37a"/><ellipse cx="92" cy="18" rx="16" ry="8" fill="#9be37a"/>
    <path d="M-118 22 L118 22 L78 -22 L-78 -22 Z" fill="#5cc96b" stroke="#2f8a45" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-60 -4 l14 -10 h20 l14 10 l-14 10 h-20 Z M-6 -4 l14 -10 h20 l14 10 l-14 10 h-20 Z" fill="none" stroke="#2f8a45" stroke-width="3" opacity="0.6"/>
    <ellipse cx="-16" cy="2" rx="4.5" ry="6" fill="#1d1a2c"/><ellipse cx="16" cy="2" rx="4.5" ry="6" fill="#1d1a2c"/>
