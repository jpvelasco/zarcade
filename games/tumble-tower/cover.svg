  <path d="M190 392 Q205 450 240 500 L560 500 Q595 450 610 392 Z" fill="#c99a6a"/>
  <g fill="#94673f"><ellipse cx="300" cy="440" rx="18" ry="9"/><ellipse cx="470" cy="460" rx="22" ry="10"/><ellipse cx="390" cy="420" rx="14" ry="7"/></g>
  <path d="M184 384 L616 384 L614 404 Q600 416 590 404 Q576 416 562 404 Q548 416 534 404 Q520 416 506 404 Q492 416 478 404 Q464 416 450 404 Q436 416 422 404 Q408 416 394 404 Q380 416 366 404 Q352 416 338 404 Q324 416 310 404 Q296 416 282 404 Q268 416 254 404 Q240 416 226 404 Q212 416 198 404 Q190 410 186 404 Z" fill="#4fae3a"/>
  <rect x="184" y="380" width="432" height="12" fill="#7ed957"/>
