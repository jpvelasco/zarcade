  <g transform="translate(372 160)">
    <circle cx="-30" cy="-32" r="14" fill="#3a3a48"/><circle cx="30" cy="-32" r="14" fill="#3a3a48"/>
    <circle r="44" fill="#fbfbfb" stroke="#3a3a48" stroke-width="5"/>
    <ellipse cx="-14" cy="-2" rx="11" ry="14" fill="#3a3a48" transform="rotate(30 -14 -2)"/>
    <ellipse cx="14" cy="-2" rx="11" ry="14" fill="#3a3a48" transform="rotate(-30 14 -2)"/>
