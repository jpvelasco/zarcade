  </g>
  <!-- crane rail and cable -->
  <rect x="0" y="0" width="800" height="22" fill="#ffc43d"/>
  <path d="M0 4 L20 20 L40 4 L60 20 L80 4 L100 20 L120 4 L140 20 L160 4 L180 20 L200 4 L220 20 L240 4 L260 20 L280 4 L300 20 L320 4 L340 20 L360 4 L380 20 L400 4 L420 20 L440 4 L460 20 L480 4 L500 20 L520 4 L540 20 L560 4 L580 20 L600 4 L620 20 L640 4 L660 20 L680 4 L700 20 L720 4 L740 20 L760 4 L780 20 L800 4" stroke="#c98a14" stroke-width="3" fill="none"/>
  <rect x="452" y="6" width="44" height="24" rx="7" fill="#ff7a59" stroke="#c4503a" stroke-width="2"/>
  <line x1="474" y1="30" x2="474" y2="78" stroke="#3d3355" stroke-width="4"/>
  <path d="M458 92 L460 78 L488 78 L490 92" stroke="#5b4f78" stroke-width="5" fill="none" stroke-linecap="round"/>
