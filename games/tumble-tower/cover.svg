    <circle r="36" fill="#ffe45c" stroke="#d1a514" stroke-width="5"/>
    <ellipse cx="-26" cy="8" rx="11" ry="15" fill="#ffd21f" transform="rotate(20 -26 8)"/>
    <ellipse cx="26" cy="8" rx="11" ry="15" fill="#ffd21f" transform="rotate(-20 26 8)"/>
    <ellipse cx="-10" cy="-6" rx="5" ry="6.5" fill="#1d1a2c"/><ellipse cx="10" cy="-6" rx="5" ry="6.5" fill="#1d1a2c"/>
    <circle cx="-12" cy="-9" r="2" fill="#fff"/><circle cx="8" cy="-9" r="2" fill="#fff"/>
    <path d="M-6 4 L6 4 L0 12 Z" fill="#ff9b2e"/>
