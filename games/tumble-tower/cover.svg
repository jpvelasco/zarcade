<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec6ff"/>
      <stop offset="0.6" stop-color="#bfeaff"/>
      <stop offset="1" stop-color="#fff3d1"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6e8"/>
      <stop offset="1" stop-color="#1f7fc4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="110" cy="120" r="34"/><circle cx="150" cy="104" r="44"/><circle cx="196" cy="122" r="32"/>
    <circle cx="610" cy="88" r="26"/><circle cx="642" cy="74" r="36"/><circle cx="680" cy="92" r="26"/>
    <circle cx="660" cy="250" r="20"/><circle cx="686" cy="240" r="28"/><circle cx="714" cy="254" r="18"/>
  </g>
