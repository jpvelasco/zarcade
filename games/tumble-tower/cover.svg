    <circle cx="34" cy="16" r="4" fill="#6d5fae"/><circle cx="56" cy="16" r="4" fill="#6d5fae"/>
    <path d="M18 -14 q6 -9 12 0 M50 -14 q6 -9 12 0" stroke="#1d1a2c" stroke-width="5" fill="none" stroke-linecap="round"/>
