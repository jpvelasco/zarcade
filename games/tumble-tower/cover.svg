    <circle cx="-14" cy="0" r="3.5" fill="#1d1a2c"/><circle cx="14" cy="0" r="3.5" fill="#1d1a2c"/>
    <ellipse cx="0" cy="12" rx="5" ry="3.5" fill="#2a2a36"/>
    <path d="M-6 22 q3 -4 6 0 q3 4 6 0" stroke="#1d1a2c" stroke-width="3" fill="none" stroke-linecap="round"/>
