<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b74d6"/>
      <stop offset="0.55" stop-color="#f4a3b6"/>
      <stop offset="1" stop-color="#ffd99c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc2a8"/>
      <stop offset="0.45" stop-color="#1f6f6a"/>
      <stop offset="1" stop-color="#0c2f3a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c0"/>
      <stop offset="0.35" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fffbe0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fishBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2793a"/>
      <stop offset="0.5" stop-color="#ffb84a"/>
      <stop offset="1" stop-color="#fff0c0"/>
    </linearGradient>
    <linearGradient id="bass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7a3a"/>
      <stop offset="0.5" stop-color="#6d9a4e"/>
      <stop offset="1" stop-color="#e3e8b4"/>
    </linearGradient>
    <radialGradient id="glow" r="0.5">
      <stop offset="0" stop-color="#fff9b0"/>
      <stop offset="1" stop-color="#fff9b0" stop-opacity="0"/>
    </radialGradient>
