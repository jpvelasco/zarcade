<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd6ee"/>
      <stop offset="0.45" stop-color="#1f8fb0"/>
      <stop offset="1" stop-color="#0a2a55"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffec8a"/>
      <stop offset="0.5" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#d99a0b"/>
    </linearGradient>
    <radialGradient id="win" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#6fd0f0"/>
    </radialGradient>
    <radialGradient id="beam" cx="0" cy="0.5" r="1">
      <stop offset="0" stop-color="#fff8d0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff8d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" r="0.5">
      <stop offset="0" stop-color="#5ef2d0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5ef2d0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sea)"/>
  <g fill="#ffffff" opacity="0.1">
    <path d="M90 0 H150 L330 500 H230 Z"/>
    <path d="M330 0 H370 L520 500 H450 Z"/>
    <path d="M560 0 H640 L800 420 V500 H730 Z"/>
  </g>
  <!-- sea floor -->
  <path d="M0 430 C120 400 200 450 300 430 C420 405 520 455 640 425 C710 410 760 420 800 415 V500 H0 Z" fill="#c96f8d"/>
  <path d="M0 430 C120 400 200 450 300 430 C420 405 520 455 640 425 C710 410 760 420 800 415" fill="none" stroke="#f2a3bd" stroke-width="7"/>
  <!-- coral -->
  <g stroke-linecap="round" fill="none">
    <path d="M90 428 V385 M90 400 L70 375 M90 395 L112 368 M70 375 L62 355 M112 368 L120 350" stroke="#ffb36a" stroke-width="9"/>
    <path d="M690 420 V380 M690 392 L668 365 M690 388 L712 360" stroke="#b07aff" stroke-width="9"/>
  </g>
  <path d="M520 440 A34 34 0 0 1 588 440 Z" fill="#ff7eb6"/>
  <path d="M230 438 A26 20 0 0 1 282 438 Z" fill="#5ef2d0"/>
  <!-- kelp -->
  <g stroke="#4f8a3a" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M30 440 C10 360 55 300 25 220 C10 170 40 120 30 80"/>
    <path d="M770 430 C790 360 750 300 775 230 C790 180 760 140 772 100"/>
  </g>
  <g fill="#6aa84f">
    <ellipse cx="42" cy="300" rx="16" ry="6" transform="rotate(-30 42 300)"/>
    <ellipse cx="14" cy="230" rx="16" ry="6" transform="rotate(30 14 230)"/>
    <ellipse cx="44" cy="150" rx="16" ry="6" transform="rotate(-30 44 150)"/>
    <ellipse cx="758" cy="300" rx="16" ry="6" transform="rotate(30 758 300)"/>
    <ellipse cx="788" cy="210" rx="16" ry="6" transform="rotate(-30 788 210)"/>
  </g>
  <!-- sonar rings -->
  <g fill="none" stroke="#bffff6" stroke-width="4">
    <circle cx="400" cy="240" r="150" opacity="0.35"/>
    <circle cx="400" cy="240" r="220" opacity="0.18"/>
  </g>
  <!-- headlight beam -->
  <path d="M500 225 L800 130 L800 340 Z" fill="url(#beam)"/>
  <!-- fish -->
  <g>
    <g transform="translate(640 240)">
      <path d="M-30 0 L-48 -14 L-48 14 Z" fill="#e8741c"/>
      <ellipse rx="34" ry="18" fill="#ff8a2a"/>
      <path d="M-8 -18 Q-2 0 -8 18" stroke="#fff" stroke-width="8" fill="none"/>
      <path d="M14 -16 Q20 0 14 16" stroke="#fff" stroke-width="7" fill="none"/>
      <circle cx="22" cy="-4" r="5" fill="#fff"/><circle cx="23.5" cy="-4" r="3" fill="#16121f"/>
    </g>
    <g transform="translate(170 150) scale(-1 1)">
      <path d="M-26 0 L-42 -16 L-42 16 Z" fill="#2563d8"/>
      <ellipse rx="30" ry="20" fill="#2f7bff"/>
      <path d="M-30 4 L-44 0" stroke="#ffd23f" stroke-width="6"/>
      <circle cx="16" cy="-5" r="5" fill="#fff"/><circle cx="17.5" cy="-5" r="3" fill="#16121f"/>
    </g>
    <g transform="translate(220 205) scale(-0.7 0.7)">
      <path d="M-26 0 L-42 -16 L-42 16 Z" fill="#2563d8"/>
      <ellipse rx="30" ry="20" fill="#2f7bff"/>
      <circle cx="16" cy="-5" r="5" fill="#fff"/><circle cx="17.5" cy="-5" r="3" fill="#16121f"/>
    </g>
  </g>
  <!-- jelly -->
  <g transform="translate(600 380)">
    <circle r="40" fill="url(#glow)"/>
    <path d="M-20 0 C-20 -28 20 -28 20 0 Z" fill="#c9d8ff" opacity="0.9"/>
    <path d="M-14 0 q4 14 0 26 M0 0 q-4 14 0 30 M14 0 q4 14 0 26" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
  </g>
  <!-- golden shell -->
  <g transform="translate(330 405)">
    <circle r="34" fill="#ffe680" opacity="0.35"/>
    <path d="M0 14 L-18 -2 A18 16 0 0 1 18 -2 Z" fill="#ffd23f" stroke="#b8780b" stroke-width="2"/>
    <path d="M0 14 L-9 -12 M0 14 L0 -14 M0 14 L9 -12" stroke="#b8780b" stroke-width="2"/>
  </g>
  <!-- Bubbles the sub -->
  <g transform="translate(400 240)">
    <rect x="-150" y="-8" width="20" height="16" fill="#5a6270"/>
    <ellipse cx="-156" cy="-16" rx="7" ry="16" fill="#c9d2de"/>
    <ellipse cx="-156" cy="16" rx="7" ry="16" fill="#aab4c2"/>
    <path d="M-100 -40 L-140 -70 L-128 -28 Z M-100 40 L-140 70 L-128 28 Z" fill="#ff9f1c"/>
    <rect x="-30" y="-96" width="62" height="44" rx="16" fill="#ff9f1c"/>
    <path d="M12 -96 V-120 H30" stroke="#5a6270" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse rx="110" ry="58" fill="url(#hull)" stroke="#8a5a00" stroke-width="5"/>
    <ellipse cx="-22" cy="-34" rx="60" ry="10" fill="#ffffff" opacity="0.4"/>
    <circle cx="-56" cy="4" r="12" fill="#5a6270"/><circle cx="-56" cy="4" r="8" fill="#9fe6ff"/>
    <circle cx="-22" cy="4" r="12" fill="#5a6270"/><circle cx="-22" cy="4" r="8" fill="#9fe6ff"/>
    <circle cx="52" cy="-6" r="40" fill="#5a6270"/>
    <circle cx="52" cy="-6" r="33" fill="url(#win)"/>
    <circle cx="40" cy="-10" r="11" fill="#fff"/><circle cx="44" cy="-10" r="6.5" fill="#16121f"/><circle cx="46" cy="-13" r="2.4" fill="#fff"/>
    <circle cx="66" cy="-10" r="11" fill="#fff"/><circle cx="70" cy="-10" r="6.5" fill="#16121f"/><circle cx="72" cy="-13" r="2.4" fill="#fff"/>
    <path d="M42 6 Q54 18 66 6" stroke="#2b3a4a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="34" cy="8" rx="5" ry="3" fill="#ff7896" opacity="0.7"/>
    <ellipse cx="74" cy="8" rx="5" ry="3" fill="#ff7896" opacity="0.7"/>
    <rect x="86" y="-50" width="24" height="20" rx="6" fill="#5a6270"/>
    <circle cx="108" cy="-40" r="8" fill="#fff6c4"/>
  </g>
  <!-- bubbles -->
  <g fill="#e8fbff" fill-opacity="0.25" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8">
    <circle cx="232" cy="200" r="10"/>
    <circle cx="210" cy="160" r="7"/>
    <circle cx="226" cy="120" r="12"/>
    <circle cx="200" cy="80" r="6"/>
    <circle cx="470" cy="80" r="9"/>
    <circle cx="490" cy="46" r="6"/>
  </g>
</svg>
