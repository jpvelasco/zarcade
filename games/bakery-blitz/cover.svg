    <rect y="334" width="800" height="36" fill="#8a5128"/>
    <rect y="334" width="800" height="8" fill="#fff" opacity="0.16"/>
    <rect y="370" width="800" height="10" fill="#6a3c1c"/>
    <rect x="24" y="344" width="752" height="22" rx="8" fill="#fff" opacity="0.2"/>

    <!-- pastries on display -->
    <g transform="translate(96 262)">
      <path d="M8 60h64l-10 46H18z" fill="#e78fa6" stroke="#c4697f" stroke-width="3"/>
      <g fill="#fff" opacity="0.45"><rect x="18" y="60" width="5" height="46"/><rect x="32" y="60" width="5" height="46"/><rect x="46" y="60" width="5" height="46"/><rect x="60" y="60" width="5" height="46"/></g>
      <g fill="url(#frost)"><circle cx="22" cy="56" r="17"/><circle cx="58" cy="56" r="17"/><circle cx="40" cy="44" r="21"/><circle cx="29" cy="28" r="14"/><circle cx="51" cy="27" r="13"/><circle cx="40" cy="16" r="12"/></g>
      <circle cx="40" cy="2" r="8" fill="#e0433f"/>
      <g fill="#ffe06a"><circle cx="28" cy="40" r="3"/><circle cx="50" cy="44" r="3"/><circle cx="42" cy="30" r="3"/></g>
    </g>
    <g transform="translate(236 272)">
      <g stroke="#8d4f20" stroke-width="22" fill="none" stroke-linecap="round">
        <circle cx="28" cy="66" r="20"/><circle cx="72" cy="66" r="20"/><circle cx="50" cy="34" r="21"/>
      </g>
      <g stroke="#c8812f" stroke-width="14" fill="none">
        <circle cx="28" cy="66" r="20"/><circle cx="72" cy="66" r="20"/><circle cx="50" cy="34" r="21"/>
      </g>
      <g fill="#fff" opacity="0.9"><circle cx="34" cy="48" r="3"/><circle cx="66" cy="52" r="3"/><circle cx="50" cy="78" r="3"/></g>
    </g>
    <g transform="translate(366 254)">
      <ellipse cx="54" cy="116" rx="52" ry="9" fill="#000" opacity="0.15"/>
      <g stroke="#d8ab74" stroke-width="3">
        <rect x="8" y="78" width="92" height="34" rx="6" fill="#ffe6bd"/>
        <rect x="18" y="48" width="72" height="32" rx="6" fill="#fff0d0"/>
        <rect x="28" y="20" width="52" height="30" rx="6" fill="#ffe6bd"/>
      </g>
      <g fill="#ff9ec4"><rect x="10" y="92" width="88" height="8"/><rect x="20" y="62" width="68" height="8"/><rect x="30" y="34" width="48" height="8"/></g>
      <g fill="#e0433f"><circle cx="42" cy="14" r="7"/><circle cx="56" cy="10" r="7"/><circle cx="68" cy="15" r="7"/></g>
    </g>
    <g transform="translate(486 278)">
      <ellipse cx="44" cy="96" rx="34" ry="7" fill="#000" opacity="0.15"/>
      <path d="M62 54a14 14 0 0 1 0 26" stroke="#e8d3b8" stroke-width="9" fill="none"/>
      <rect x="16" y="38" width="52" height="54" rx="11" fill="#fff6ea" stroke="#d9b78f" stroke-width="4"/>
      <ellipse cx="42" cy="42" rx="22" ry="6" fill="#8d5524"/>
      <rect x="34" y="34" width="14" height="8" rx="3" fill="#fffaf2"/>
      <path d="M32 24q7-9 0-18M52 28q7-9 0-16" stroke="#fff" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
    </g>
    <!-- coins on the counter -->
    <g>
      <circle cx="690" cy="348" r="15" fill="#d99a2b"/><circle cx="690" cy="345" r="12" fill="#ffd166"/>
      <circle cx="722" cy="352" r="12" fill="#d99a2b"/><circle cx="722" cy="349" r="9.5" fill="#ffd166"/>
      <circle cx="706" cy="330" r="11" fill="#d99a2b"/><circle cx="706" cy="327" r="8.5" fill="#ffd166"/>
    </g>
    <!-- Flour the helper mouse -->
    <g transform="translate(570 330)">
      <ellipse cx="22" cy="24" rx="20" ry="14" fill="#c9c2cf"/>
      <rect x="12" y="18" width="20" height="18" rx="4" fill="#fff6e6"/>
      <circle cx="40" cy="16" r="12" fill="#d6d0db"/>
      <circle cx="35" cy="3" r="9" fill="#e8c3cf"/>
      <circle cx="47" cy="14" r="2.4" fill="#3a2318"/>
      <path d="M4 26Q-8 16 0 4" stroke="#e8c3cf" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- sparkles -->
  <g stroke="#fff3c4" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M470 108v22M459 119h22M452 112l16 16M468 112l-16 16"/>
    <path d="M520 62v14M513 69h14"/>
  </g>
</svg>
