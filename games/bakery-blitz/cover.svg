<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9cd"/>
      <stop offset="1" stop-color="#eec194"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3f6b"/>
      <stop offset="0.6" stop-color="#5b5a8c"/>
      <stop offset="1" stop-color="#d08f7a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a62"/>
      <stop offset="1" stop-color="#9c5e34"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9683a"/>
      <stop offset="1" stop-color="#7a4520"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3cf"/>
      <stop offset="1" stop-color="#ff6b9e"/>
    </linearGradient>
    <radialGradient id="ovenGlow" cx="50%" cy="50%">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ff9d4d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff9d4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="50%" cy="20%">
      <stop offset="0" stop-color="#fff2cf" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff2cf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wall -->
  <rect width="800" height="500" fill="url(#wall)"/>
  <g fill="#fff" opacity="0.2">
    <rect x="30" width="22" height="370"/><rect x="100" width="22" height="370"/>
    <rect x="170" width="22" height="370"/><rect x="240" width="22" height="370"/>
    <rect x="310" width="22" height="370"/><rect x="380" width="22" height="370"/>
    <rect x="450" width="22" height="370"/><rect x="520" width="22" height="370"/>
    <rect x="590" width="22" height="370"/><rect x="660" width="22" height="370"/>
    <rect x="730" width="22" height="370"/>
  </g>
  <ellipse cx="400" cy="60" rx="320" ry="190" fill="url(#lamp)"/>

  <!-- window on the dusk street -->
  <g>
    <rect x="68" y="46" width="330" height="168" rx="14" fill="url(#sky)"/>
    <circle cx="340" cy="92" r="22" fill="#fff6d8" opacity="0.95"/>
    <g fill="#fff" opacity="0.8">
      <circle cx="110" cy="70" r="2"/><circle cx="160" cy="58" r="1.6"/><circle cx="210" cy="78" r="2.2"/>
      <circle cx="260" cy="62" r="1.6"/><circle cx="300" cy="74" r="1.8"/><circle cx="130" cy="98" r="1.4"/>
    </g>
    <g fill="#3d3457">
      <rect x="72" y="150" width="54" height="64"/><rect x="134" y="132" width="46" height="82"/>
      <rect x="188" y="158" width="58" height="56"/><rect x="254" y="138" width="50" height="76"/>
      <rect x="312" y="162" width="58" height="52"/>
    </g>
    <g fill="#ffd166" opacity="0.9">
      <rect x="82" y="162" width="12" height="14"/><rect x="104" y="162" width="12" height="14"/>
      <rect x="144" y="146" width="12" height="14"/><rect x="160" y="170" width="12" height="14"/>
      <rect x="200" y="172" width="12" height="14"/><rect x="226" y="172" width="12" height="14"/>
      <rect x="264" y="152" width="12" height="14"/><rect x="282" y="176" width="12" height="14"/>
      <rect x="324" y="176" width="12" height="14"/><rect x="348" y="176" width="12" height="14"/>
    </g>
    <rect x="68" y="46" width="330" height="168" rx="14" fill="none" stroke="#fff6ea" stroke-width="12"/>
    <path d="M233 46v168M68 130h330" stroke="#fff6ea" stroke-width="9"/>
    <!-- window box of daisies -->
    <rect x="86" y="206" width="292" height="30" rx="7" fill="url(#wood)"/>
    <g>
      <g fill="#ff9ec4"><circle cx="120" cy="196" r="7"/><circle cx="134" cy="190" r="7"/><circle cx="148" cy="196" r="7"/><circle cx="134" cy="202" r="7"/></g>
      <circle cx="134" cy="196" r="5" fill="#ffd166"/>
      <g fill="#fff3d9"><circle cx="216" cy="194" r="7"/><circle cx="230" cy="188" r="7"/><circle cx="244" cy="194" r="7"/><circle cx="230" cy="200" r="7"/></g>
      <circle cx="230" cy="194" r="5" fill="#ffd166"/>
      <g fill="#ffd166"><circle cx="316" cy="196" r="7"/><circle cx="330" cy="190" r="7"/><circle cx="344" cy="196" r="7"/><circle cx="330" cy="202" r="7"/></g>
      <circle cx="330" cy="196" r="5" fill="#ff9ec4"/>
      <g stroke="#5c8b3a" stroke-width="4" fill="none"><path d="M134 204v8M230 202v10M330 204v8"/></g>
    </g>
  </g>

  <!-- bunting -->
  <path d="M0 18 Q400 44 800 18" stroke="#9c5f33" stroke-width="4" fill="none"/>
  <g>
    <path d="M44 24h34l-17 30z" fill="#ff9ec4"/>
    <path d="M124 29h34l-17 30z" fill="#ffd166"/>
    <path d="M204 33h34l-17 30z" fill="#7fd3ff"/>
    <path d="M284 36h34l-17 30z" fill="#9ae26a"/>
    <path d="M364 38h34l-17 30z" fill="#ff9ec4"/>
    <path d="M444 37h34l-17 30z" fill="#ffd166"/>
    <path d="M524 34h34l-17 30z" fill="#7fd3ff"/>
    <path d="M604 30h34l-17 30z" fill="#9ae26a"/>
    <path d="M684 25h34l-17 30z" fill="#ff9ec4"/>
  </g>

  <!-- the oven, warm and busy -->
  <g>
    <ellipse cx="640" cy="250" rx="150" ry="130" fill="url(#ovenGlow)"/>
    <rect x="536" y="128" width="212" height="214" rx="16" fill="#8a6a52" stroke="#5f452f" stroke-width="7"/>
    <rect x="536" y="128" width="212" height="40" rx="14" fill="#9d7a5e"/>
    <circle cx="572" cy="148" r="12" fill="#f0dcc2" stroke="#7c5c42" stroke-width="4"/>
    <circle cx="712" cy="148" r="12" fill="#f0dcc2" stroke="#7c5c42" stroke-width="4"/>
    <path d="M572 148v-7M712 148v-7" stroke="#7c5c42" stroke-width="4"/>
    <rect x="562" y="186" width="160" height="112" rx="12" fill="#3a2318"/>
    <rect x="572" y="196" width="140" height="92" rx="9" fill="#ff9d4d" opacity="0.45"/>
