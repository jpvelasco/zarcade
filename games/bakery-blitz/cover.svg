    <!-- bear -->
    <g transform="translate(150 206)">
      <ellipse cx="60" cy="150" rx="62" ry="22" fill="#000" opacity="0.12"/>
      <path d="M8 152q-6-66 52-70 58 4 52 70z" fill="#a9754f" stroke="#6b4228" stroke-width="4"/>
      <ellipse cx="60" cy="126" rx="30" ry="24" fill="#e3bb95"/>
      <circle cx="30" cy="52" r="17" fill="#a9754f"/><circle cx="30" cy="52" r="8" fill="#e3bb95"/>
      <circle cx="90" cy="52" r="17" fill="#a9754f"/><circle cx="90" cy="52" r="8" fill="#e3bb95"/>
      <circle cx="60" cy="68" r="42" fill="#a9754f" stroke="#6b4228" stroke-width="4"/>
      <ellipse cx="60" cy="86" rx="22" ry="15" fill="#e3bb95"/>
      <g fill="#3a2318"><circle cx="45" cy="62" r="5"/><circle cx="75" cy="62" r="5"/></g>
