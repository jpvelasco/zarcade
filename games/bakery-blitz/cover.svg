      <circle cx="616" cy="238" r="16"/><circle cx="652" cy="238" r="16"/><circle cx="634" cy="212" r="16"/>
    </g>
    <rect x="566" y="306" width="152" height="12" rx="6" fill="#d9c3a5"/>
    <!-- ding! -->
    <g transform="translate(726 112)">
      <circle r="26" fill="#ffd166" stroke="#e2a93c" stroke-width="4"/>
      <path d="M-12 8q1-20 12-23 11 3 12 23z" fill="#8a5128"/>
      <rect x="-14" y="8" width="28" height="5" rx="2.5" fill="#8a5128"/>
      <circle cy="18" r="4" fill="#8a5128"/>
