      <path d="M6 128q-6-56 44-60 50 4 44 60z" fill="#c9743a" stroke="#8a4b20" stroke-width="4"/>
      <ellipse cx="50" cy="108" rx="24" ry="19" fill="#f0c49a"/>
      <ellipse cx="28" cy="36" rx="11" ry="14" fill="#c9743a"/>
      <ellipse cx="72" cy="36" rx="11" ry="14" fill="#c9743a"/>
      <circle cx="50" cy="54" r="34" fill="#c9743a" stroke="#8a4b20" stroke-width="4"/>
      <ellipse cx="50" cy="68" rx="18" ry="12" fill="#f0c49a"/>
      <g fill="#3a2318"><circle cx="38" cy="48" r="4.4"/><circle cx="62" cy="48" r="4.4"/></g>
      <path d="M42 70h16" stroke="#3a2318" stroke-width="4" stroke-linecap="round"/>
      <g fill="#ff8ca6" opacity="0.4"><ellipse cx="26" cy="64" rx="8" ry="5"/><ellipse cx="74" cy="64" rx="8" ry="5"/></g>
    </g>
    <!-- hearts over the bear -->
    <g fill="#ff6b8e">
      <path d="M196 180c-18-13-13-30 0-22 13-8 18 9 0 22z"/>
      <path d="M232 170c-15-11-11-25 0-18 11-7 15 7 0 18z" opacity="0.95"/>
      <path d="M264 180c-13-9-9-21 0-15 9-6 13 6 0 15z" opacity="0.5"/>
    </g>
  </g>

  <!-- the counter -->
