<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" aria-label="Comet Courier cover: a comet slides toward a glowing mailbox star">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070313"/>
      <stop offset="0.55" stop-color="#0b0620"/>
      <stop offset="1" stop-color="#1b0d3d"/>
    </linearGradient>
    <radialGradient id="panel" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#1d1447"/>
      <stop offset="1" stop-color="#120b30"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffd98a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cometBall" cx="0.35" cy="0.35" r="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffb35c"/>
    </radialGradient>
    <linearGradient id="cometTail" x1="1" y1="0" x2="0" y2="0.4">
      <stop offset="0" stop-color="#9fe0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7ad1ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cupWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6fb8"/>
      <stop offset="1" stop-color="#2c3a75"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="70" cy="60" r="1.6" opacity="0.9"/>
    <circle cx="150" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="240" cy="50" r="2" opacity="0.95"/>
    <circle cx="330" cy="120" r="1.1" opacity="0.5"/>
    <circle cx="420" cy="60" r="1.5" opacity="0.8"/>
    <circle cx="520" cy="110" r="1.2" opacity="0.6"/>
    <circle cx="620" cy="45" r="1.8" opacity="0.9"/>
    <circle cx="710" cy="140" r="1.3" opacity="0.6"/>
    <circle cx="760" cy="70" r="1.5" opacity="0.85"/>
    <circle cx="90" cy="420" r="1.4" opacity="0.7"/>
    <circle cx="190" cy="460" r="1.8" opacity="0.9"/>
    <circle cx="640" cy="440" r="1.4" opacity="0.7"/>
    <circle cx="740" cy="390" r="2" opacity="0.95"/>
    <circle cx="60" cy="260" r="1.2" opacity="0.5"/>
    <circle cx="770" cy="250" r="1.2" opacity="0.55"/>
    <circle cx="390" cy="455" r="1.3" opacity="0.6"/>
    <circle cx="480" cy="30" r="1.1" opacity="0.5"/>
    <circle cx="60" cy="350" r="1.7" opacity="0.8"/>
    <circle cx="745" cy="320" r="1.2" opacity="0.6"/>
  </g>

  <!-- the cosmic panel -->
  <rect x="170" y="90" width="460" height="340" rx="26" fill="url(#panel)"/>
  <rect x="170" y="90" width="460" height="340" rx="26" fill="none" stroke="#31437d" stroke-width="6"/>
  <rect x="182" y="102" width="436" height="316" rx="18" fill="none" stroke="#9db4ff" stroke-opacity="0.35" stroke-width="2"/>
  <g stroke="#22305f" stroke-width="1" opacity="0.6">
    <line x1="285" y1="100" x2="285" y2="420"/>
    <line x1="400" y1="100" x2="400" y2="420"/>
    <line x1="515" y1="100" x2="515" y2="420"/>
    <line x1="180" y1="205" x2="620" y2="205"/>
    <line x1="180" y1="320" x2="620" y2="320"/>
  </g>

  <!-- a mail-rock block -->
  <rect x="220" y="300" width="72" height="36" rx="9" fill="#2c3a75" stroke="#cfe0ff" stroke-opacity="0.5" stroke-width="2"/>
  <!-- an asteroid -->
  <circle cx="430" cy="150" r="26" fill="#3d3554"/>
  <circle cx="430" cy="150" r="26" fill="none" stroke="#8d81a8" stroke-width="2"/>
  <circle cx="422" cy="144" r="5" fill="#000000" opacity="0.3"/>
  <circle cx="440" cy="158" r="4" fill="#000000" opacity="0.3"/>

  <!-- the mailbox star, guarded by a small cup -->
  <g>
    <circle cx="400" cy="260" r="86" fill="url(#starGlow)"/>
    <path d="M352 212 L448 212 L448 228 L352 228 Z" fill="url(#cupWall)" opacity="0.9"/>
    <path d="M352 292 L392 292 L392 308 L352 308 Z" fill="url(#cupWall)" opacity="0.9"/>
    <path d="M408 292 L448 292 L448 308 L408 308 Z" fill="url(#cupWall)" opacity="0.9"/>
    <path d="M334 228 L350 228 L350 308 L334 308 Z" fill="url(#cupWall)" opacity="0.9"/>
    <path d="M450 228 L466 228 L466 308 L450 308 Z" fill="url(#cupWall)" opacity="0.9"/>
    <circle cx="400" cy="260" r="30" fill="none" stroke="#ffd98a" stroke-width="4"/>
    <path d="M400 238 L406 253 L422 254 L410 265 L414 281 L400 272 L386 281 L390 265 L378 254 L394 253 Z" fill="#fff3c4"/>
  </g>

  <!-- the comet, mid-flight toward the star -->
  <g>
    <path d="M218 398 C 280 380, 320 350, 348 316 L 362 330 C 336 368, 292 404, 226 416 Z" fill="url(#cometTail)"/>
    <circle cx="360" cy="322" r="20" fill="url(#cometBall)"/>
    <circle cx="360" cy="322" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
    <rect x="352" y="325" width="17" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="352" y="329" width="17" height="2.4" fill="#2b2440" opacity="0.6"/>
  </g>

  <!-- spawn postmark -->
  <circle cx="235" cy="382" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- corner twinkles near the star -->
  <g fill="#ffe9b0">
    <path d="M488 190 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" opacity="0.85"/>
    <path d="M310 190 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z" opacity="0.6"/>
  </g>
</svg>
