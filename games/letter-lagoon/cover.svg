<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ef0f8"/>
      <stop offset="0.45" stop-color="#2cc3df"/>
      <stop offset="1" stop-color="#0a6aa0"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dca0"/>
      <stop offset="1" stop-color="#ddb878"/>
    </linearGradient>
    <radialGradient id="bub" cx="33%" cy="27%" r="75%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.3" stop-color="#ecfcff"/>
      <stop offset="0.75" stop-color="#b5ecf9"/>
      <stop offset="1" stop-color="#6fd0e8"/>
    </radialGradient>
    <radialGradient id="gold" cx="33%" cy="27%" r="75%">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.3" stop-color="#ffe27a"/>
      <stop offset="0.8" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </radialGradient>
    <radialGradient id="air" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.9" stop-color="#cdf5ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="1" stop-color="#ffe9a6"/>
    </linearGradient>
    <radialGradient id="shell" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ff9f80"/>
      <stop offset="0.55" stop-color="#ff5a4a"/>
      <stop offset="1" stop-color="#d93838"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#water)"/>
  <path d="M70 0 L130 0 L260 420 L170 420Z M330 0 L370 0 L470 420 L400 420Z M560 0 L620 0 L760 420 L680 420Z" fill="url(#ray)"/>
  <g fill="#fff" opacity="0.2">
    <ellipse cx="60" cy="10" rx="40" ry="6"/><ellipse cx="220" cy="8" rx="50" ry="6"/><ellipse cx="420" cy="12" rx="44" ry="6"/><ellipse cx="640" cy="9" rx="56" ry="6"/>
  </g>
  <path d="M0 400 Q120 360 240 392 T480 384 T800 376 V500 H0Z" fill="#0b5f96" opacity="0.35"/>

  <!-- kelp and coral -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 500 Q20 400 54 300 Q70 250 50 200" stroke="#2fae78" stroke-width="14" opacity="0.8"/>
    <path d="M760 500 Q790 410 750 320 Q735 280 760 230" stroke="#3fbf86" stroke-width="14" opacity="0.8"/>
    <g stroke="#ff7f9e" stroke-width="7">
      <path d="M690 470 L690 420 M690 440 L670 410 M690 432 L712 400 M670 410 L662 390 M712 400 L724 386"/>
    </g>
  </g>
  <path d="M86 470 Q50 420 92 404 Q134 420 98 470Z" fill="#b48cff"/>
  <path d="M0 455 Q140 430 300 452 T600 448 T800 446 V500 H0Z" fill="url(#sand)"/>
  <g fill="#fff" opacity="0.5"><circle cx="120" cy="476" r="3"/><circle cx="360" cy="482" r="2.5"/><circle cx="520" cy="470" r="3"/><circle cx="660" cy="488" r="2"/></g>

  <!-- floating bubbles -->
  <g fill="url(#air)">
    <circle cx="150" cy="120" r="12"/><circle cx="182" cy="80" r="7"/><circle cx="616" cy="70" r="14"/><circle cx="650" cy="40" r="8"/><circle cx="420" cy="40" r="6"/><circle cx="300" cy="350" r="9"/>
  </g>

  <!-- crossword tiles -->
  <g font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif" font-weight="900" font-size="36" text-anchor="middle" fill="#12305a">
    <g stroke="#e2b65a" stroke-width="0">
      <rect x="96" y="176" width="54" height="54" rx="12" fill="url(#tile)"/><text x="123" y="216">S</text>
      <rect x="156" y="176" width="54" height="54" rx="12" fill="url(#tile)"/><text x="183" y="216">E</text>
      <rect x="216" y="176" width="54" height="54" rx="12" fill="url(#tile)"/><text x="243" y="216">A</text>
      <rect x="156" y="236" width="54" height="54" rx="12" fill="url(#tile)"/><text x="183" y="276">E</text>
      <rect x="156" y="296" width="54" height="54" rx="12" fill="url(#tile)"/><text x="183" y="336">L</text>
      <rect x="216" y="116" width="54" height="54" rx="12" fill="#fff" fill-opacity="0.3" stroke="#fff" stroke-opacity="0.6" stroke-width="3"/>
      <rect x="216" y="236" width="54" height="54" rx="12" fill="#fff" fill-opacity="0.3" stroke="#fff" stroke-opacity="0.6" stroke-width="3"/>
      <rect x="216" y="296" width="54" height="54" rx="12" fill="#fff" fill-opacity="0.3" stroke="#fff" stroke-opacity="0.6" stroke-width="3"/>
      <rect x="276" y="296" width="54" height="54" rx="12" fill="#fff" fill-opacity="0.3" stroke="#fff" stroke-opacity="0.6" stroke-width="3"/>
    </g>
  </g>

  <!-- letter wheel -->
  <circle cx="560" cy="270" r="130" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.5" stroke-width="4"/>
  <polyline points="560,180 646,242 612,348" fill="none" stroke="#ffb52e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <g font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif" font-weight="900" font-size="44" text-anchor="middle">
    <circle cx="560" cy="180" r="40" fill="url(#gold)"/><text x="560" y="196" fill="#5a2a00">S</text>
    <circle cx="646" cy="242" r="40" fill="url(#gold)"/><text x="646" y="258" fill="#5a2a00">E</text>
    <circle cx="612" cy="348" r="40" fill="url(#gold)"/><text x="612" y="364" fill="#5a2a00">A</text>
    <circle cx="508" cy="348" r="40" fill="url(#bub)"/><text x="508" y="364" fill="#12305a">L</text>
    <circle cx="474" cy="242" r="40" fill="url(#bub)"/><text x="474" y="258" fill="#12305a">T</text>
  </g>

  <!-- a trapped seahorse and a freed turtle -->
  <circle cx="370" cy="140" r="40" fill="url(#air)" stroke="#fff" stroke-opacity="0.8" stroke-width="3"/>
  <g transform="translate(372 142) scale(0.72)" stroke="#1d3557" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M2 20 C-6 36 0 48 12 46 C22 44 20 32 11 33" fill="none" stroke-width="14"/>
    <path d="M2 20 C-6 36 0 48 12 46 C22 44 20 32 11 33" fill="none" stroke="#ffc23d" stroke-width="8"/>
    <path d="M4 -40 C20 -42 26 -30 20 -24 L40 -21 L40 -13 L17 -13 C26 0 22 16 8 24 C-2 28 -8 14 -8 0 C-16 -14 -12 -38 4 -40Z" fill="#ffc23d"/>
    <circle cx="12" cy="-26" r="5" fill="#fff" stroke-width="2.5"/><circle cx="13" cy="-26" r="2.6" fill="#1d3557" stroke="none"/>
  </g>
  <g transform="translate(330 420) scale(1.1)" stroke="#1d3557" stroke-width="4" stroke-linejoin="round">
    <ellipse cx="16" cy="-24" rx="16" ry="7" transform="rotate(-40 16 -24)" fill="#8be0a6" stroke-width="3.5"/>
    <ellipse cx="40" cy="-6" rx="15" ry="12" fill="#8be0a6"/>
    <ellipse cx="-2" cy="-2" rx="36" ry="25" fill="#5cc98a"/>
    <path d="M-2 -15 l10 6 v12 l-10 6 l-10 -6 v-12z" fill="none" stroke="#2f8f6a" stroke-width="3"/>
    <ellipse cx="16" cy="22" rx="17" ry="7" transform="rotate(34 16 22)" fill="#8be0a6" stroke-width="3.5"/>
    <circle cx="44" cy="-10" r="5" fill="#fff" stroke-width="2.5"/><circle cx="45.5" cy="-10" r="2.6" fill="#1d3557" stroke="none"/>
    <path d="M42 -1 Q46 2 50 -1" fill="none" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Pinch the crab -->
  <g transform="translate(110 380) scale(0.6)" stroke-linejoin="round">
    <g stroke="#b92a2f" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M58 104 Q30 112 22 136"/><path d="M62 114 Q40 128 38 150"/><path d="M142 104 Q170 112 178 136"/><path d="M138 114 Q160 128 162 150"/>
    </g>
    <path d="M60 88 Q40 72 34 52" stroke="#d93838" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M34 54 C6 50 2 18 22 10 C26 26 36 30 44 30 C46 18 56 10 64 16 C62 32 56 52 34 54Z" fill="url(#shell)" stroke="#8f1f27" stroke-width="4"/>
    <path d="M140 88 Q160 72 166 52" stroke="#d93838" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M166 54 C194 50 198 18 178 10 C174 26 164 30 156 30 C154 18 144 10 136 16 C138 32 144 52 166 54Z" fill="url(#shell)" stroke="#8f1f27" stroke-width="4"/>
    <path d="M84 62 L80 34 M116 62 L120 34" stroke="#b92a2f" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="100" cy="96" rx="58" ry="36" fill="url(#shell)" stroke="#8f1f27" stroke-width="4"/>
    <circle cx="80" cy="30" r="14" fill="#fff" stroke="#8f1f27" stroke-width="4"/><circle cx="120" cy="30" r="14" fill="#fff" stroke="#8f1f27" stroke-width="4"/>
    <circle cx="83" cy="32" r="6.5" fill="#1c2340"/><circle cx="123" cy="32" r="6.5" fill="#1c2340"/>
    <path d="M86 104 Q100 118 114 104" stroke="#6b1520" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- clownfish -->
  <g transform="translate(700 130) scale(-0.9 0.9)" stroke="#1d3557" stroke-width="4" stroke-linejoin="round">
    <path d="M-32 0 L-56 -20 Q-48 0 -56 20Z" fill="#ff8a2a"/>
    <ellipse cx="0" cy="0" rx="40" ry="26" fill="#ff8a2a"/>
    <rect x="11" y="-25" width="10" height="50" fill="#fff" stroke-width="2.5"/>
    <rect x="-15" y="-26" width="11" height="52" fill="#fff" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="40" ry="26" fill="none"/>
    <circle cx="26" cy="-6" r="7" fill="#fff" stroke-width="2.5"/><circle cx="28" cy="-6" r="3.6" fill="#1d3557" stroke="none"/>
  </g>
</svg>
