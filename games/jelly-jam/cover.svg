<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#37b6dd"/>
      <stop offset="34%" stop-color="#0d7ba8"/>
      <stop offset="72%" stop-color="#064b78"/>
      <stop offset="100%" stop-color="#03243f"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9b8"/>
      <stop offset="100%" stop-color="#d8a86a"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="g-straw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc9da"/><stop offset="48%" stop-color="#ff5f8f"/><stop offset="100%" stop-color="#bd1149"/>
    </linearGradient>
    <linearGradient id="g-kiwi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2ffab"/><stop offset="48%" stop-color="#69d43f"/><stop offset="100%" stop-color="#27801c"/>
    </linearGradient>
    <linearGradient id="g-gum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd6ff"/><stop offset="48%" stop-color="#e46bff"/><stop offset="100%" stop-color="#8623ad"/>
    </linearGradient>
    <linearGradient id="g-mango" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0b6"/><stop offset="48%" stop-color="#ffb02e"/><stop offset="100%" stop-color="#c06400"/>
    </linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbf4ff"/><stop offset="48%" stop-color="#3aa7ff"/><stop offset="100%" stop-color="#0f4d9f"/>
    </linearGradient>
    <linearGradient id="g-grape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6dcff"/><stop offset="48%" stop-color="#9a72ff"/><stop offset="100%" stop-color="#4a26a0"/>
    </linearGradient>
    <radialGradient id="pearl" cx="36%" cy="30%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#dff6ff"/><stop offset="100%" stop-color="#84bcda"/>
    </radialGradient>
    <linearGradient id="turtle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cf2c8"/><stop offset="100%" stop-color="#1c9c76"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#021a2e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#water)"/>

  <!-- light rays -->
  <g opacity="0.75">
    <polygon points="120,-40 230,-40 90,500 -20,500" fill="url(#ray)"/>
    <polygon points="360,-40 430,-40 330,500 250,500" fill="url(#ray)" opacity="0.7"/>
    <polygon points="620,-40 730,-40 700,500 560,500" fill="url(#ray)" opacity="0.55"/>
  </g>

  <!-- distant reef -->
  <g opacity="0.35">
    <path d="M0 430q60-70 120-40t90-60 110 60 120-70 130 60 110-30 120 40v110H0z" fill="#052f4f"/>
  </g>

  <!-- kelp -->
  <g stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M40 500q-22-90 14-150T44 210" stroke="#0f7a5f" stroke-width="16"/>
    <path d="M86 500q14-80-16-140t8-120" stroke="#16a074" stroke-width="12"/>
    <path d="M752 500q26-90-10-152t14-118" stroke="#0f7a5f" stroke-width="16"/>
    <path d="M706 500q-16-80 14-142t-6-108" stroke="#16a074" stroke-width="11"/>
  </g>

  <!-- sea fans -->
  <g>
    <g transform="translate(96 372) scale(1.0)">
      <rect x="-7" y="10" width="14" height="40" rx="6" fill="#a81d47"/>
      <path d="M-9 26 L-70.4 -15.0 L-72.0 -18.2 L-73.1 -21.4 L-73.2 -24.5 L-72.3 -27.3 L-70.4 -29.7 L-67.7 -31.6 L-64.5 -33.1 L-61.2 -34.4 L-58.1 -35.6 L-55.7 -37.1 L-54.0 -39.0 L-53.1 -41.4 L-52.7 -44.4 L-52.5 -47.9 L-52.4 -51.4 L-51.8 -54.9 L-50.6 -57.9 L-48.7 -60.2 L-46.1 -61.5 L-42.9 -62.1 L-39.4 -61.9 L-35.9 -61.3 L-32.5 -60.7 L-29.5 -60.5 L-26.9 -60.9 L-24.7 -62.2 L-22.8 -64.3 L-20.9 -67.0 L-19.0 -69.9 L-16.8 -72.8 L-14.4 -75.1 L-11.7 -76.4 L-8.7 -76.7 L-5.8 -75.9 L-2.8 -74.2 L0.0 -72.0 L2.6 -69.7 L5.1 -67.7 L7.6 -66.4 L10.0 -65.9 L12.7 -66.4 L15.6 -67.5 L18.7 -69.0 L22.0 -70.5 L25.3 -71.5 L28.5 -71.6 L31.3 -70.8 L33.6 -68.9 L35.4 -66.2 L36.8 -63.0 L37.9 -59.5 L39.0 -56.4 L40.2 -53.7 L41.9 -51.8 L44.2 -50.5 L47.0 -49.8 L50.4 -49.5 L53.9 -49.1 L57.4 -48.4 L60.4 -47.2 L62.7 -45.3 L64.1 -42.7 L64.6 -39.6 L64.4 -36.2 L63.6 -32.7 L62.8 -29.3 L62.3 -26.2 L62.4 -23.5 L63.3 -21.2 L65.1 -19.1 L67.6 -17.1 L70.4 -15.0 L9 26 Z" fill="#ff7fa6" stroke="#c4275a" stroke-width="3.5" stroke-linejoin="round"/>
      <g stroke="#ffd3e2" stroke-width="4" stroke-linecap="round" opacity="0.7" fill="none"><path d="M0 24 L-55.5 -25.9"/><path d="M0 24 L-24.2 -49.6"/><path d="M0 24 L0.0 -59.0"/><path d="M0 24 L27.6 -56.5"/><path d="M0 24 L51.5 -24.0"/></g>
    </g>
    <g transform="translate(716 366) scale(0.86)">
      <rect x="-7" y="10" width="14" height="40" rx="6" fill="#9c3f0c"/>
      <path d="M-9 26 L-68.5 -14.6 L-69.6 -17.6 L-70.4 -20.6 L-70.7 -23.7 L-70.3 -26.5 L-69.3 -29.2 L-67.6 -31.5 L-65.3 -33.5 L-62.6 -35.2 L-59.7 -36.6 L-56.8 -37.8 L-54.0 -39.0 L-51.6 -40.3 L-49.5 -41.8 L-47.9 -43.7 L-46.7 -45.9 L-45.7 -48.5 L-44.9 -51.3 L-44.1 -54.4 L-43.0 -57.5 L-41.7 -60.3 L-40.1 -62.9 L-38.0 -64.9 L-35.5 -66.3 L-32.7 -67.0 L-29.6 -67.1 L-26.5 -66.7 L-23.4 -66.0 L-20.3 -65.1 L-17.4 -64.3 L-14.7 -63.8 L-12.2 -63.7 L-9.8 -64.1 L-7.4 -65.0 L-5.0 -66.4 L-2.6 -68.2 L0.0 -70.0 L2.7 -71.7 L5.5 -73.2 L8.4 -74.1 L11.3 -74.3 L14.1 -73.8 L16.8 -72.6 L19.2 -70.8 L21.4 -68.5 L23.4 -66.0 L25.2 -63.4 L26.9 -60.9 L28.7 -58.8 L30.6 -57.2 L32.7 -56.0 L35.2 -55.2 L37.9 -54.8 L40.9 -54.6 L44.1 -54.4 L47.3 -54.0 L50.4 -53.4 L53.2 -52.3 L55.6 -50.6 L57.4 -48.5 L58.7 -45.9 L59.5 -43.0 L59.8 -39.8 L59.7 -36.6 L59.5 -33.4 L59.3 -30.4 L59.3 -27.7 L59.7 -25.2 L60.7 -22.9 L62.1 -20.8 L63.9 -18.7 L66.1 -16.7 L68.5 -14.6 L9 26 Z" fill="#ff9445" stroke="#b8480f" stroke-width="3.5" stroke-linejoin="round"/>
      <g stroke="#ffe0bb" stroke-width="4" stroke-linecap="round" opacity="0.7" fill="none"><path d="M0 24 L-55.4 -25.8"/><path d="M0 24 L-26.8 -54.9"/><path d="M0 24 L0.0 -57.4"/><path d="M0 24 L23.5 -48.2"/><path d="M0 24 L48.6 -22.7"/></g>
    </g>
  </g>

  <!-- sandy floor -->
  <path d="M0 440q120-34 210-10t190 6 200-26 200 22v68H0z" fill="url(#sand)"/>
  <g fill="#b8874f" opacity="0.45">
    <circle cx="120" cy="478" r="5"/><circle cx="300" cy="470" r="4"/><circle cx="470" cy="482" r="6"/>
    <circle cx="640" cy="472" r="4.5"/><circle cx="740" cy="486" r="5"/>
  </g>

  <!-- glow behind the jelly cluster -->
  <ellipse cx="400" cy="250" rx="250" ry="180" fill="#63e6ff" opacity="0.2" filter="url(#soft)"/>

  <!-- jelly cluster -->
  <g filter="url(#drop)">
    <!-- strawberry circle -->
    <g transform="translate(300 214)">
      <circle r="74" fill="url(#g-straw)"/>
      <ellipse cx="-24" cy="-34" rx="30" ry="18" fill="#fff" opacity="0.8" transform="rotate(-26)"/>
      <g fill="#fff"><circle cx="-24" cy="4" r="17"/><circle cx="24" cy="4" r="17"/></g>
      <g fill="#1b2a3a"><circle cx="-20" cy="8" r="8.4"/><circle cx="28" cy="8" r="8.4"/></g>
      <g fill="#fff"><circle cx="-23" cy="4" r="3"/><circle cx="25" cy="4" r="3"/></g>
      <path d="M-20 34q20 18 40 0" stroke="#1b2a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
      <g fill="#ff8caa" opacity="0.45"><ellipse cx="-46" cy="30" rx="13" ry="8"/><ellipse cx="50" cy="30" rx="13" ry="8"/></g>
    </g>

    <!-- kiwi rounded square -->
    <g transform="translate(436 268) rotate(-6)">
      <rect x="-62" y="-62" width="124" height="124" rx="40" fill="url(#g-kiwi)"/>
      <ellipse cx="-20" cy="-30" rx="26" ry="15" fill="#fff" opacity="0.78" transform="rotate(-24)"/>
      <g fill="#fff"><circle cx="-20" cy="2" r="15"/><circle cx="22" cy="2" r="15"/></g>
      <g fill="#1b2a3a"><circle cx="-17" cy="6" r="7.4"/><circle cx="25" cy="6" r="7.4"/></g>
      <g fill="#fff"><circle cx="-20" cy="2" r="2.6"/><circle cx="22" cy="2" r="2.6"/></g>
      <ellipse cx="2" cy="32" rx="9" ry="11" fill="#1b2a3a" opacity="0.85"/>
      <g fill="#ff8caa" opacity="0.4"><ellipse cx="-40" cy="28" rx="11" ry="7"/><ellipse cx="44" cy="28" rx="11" ry="7"/></g>
    </g>

    <!-- mango hexagon -->
    <g transform="translate(206 300) rotate(8)">
      <path d="M0-62 54-31 54 31 0 62-54 31-54-31Z" fill="url(#g-mango)" stroke="none" stroke-linejoin="round" transform="scale(1.02)"/>
      <ellipse cx="-18" cy="-30" rx="24" ry="14" fill="#fff" opacity="0.8" transform="rotate(-22)"/>
      <g fill="#fff"><circle cx="-18" cy="4" r="14"/><circle cx="20" cy="4" r="14"/></g>
      <g fill="#1b2a3a"><circle cx="-15" cy="7" r="6.8"/><circle cx="23" cy="7" r="6.8"/></g>
      <g fill="#fff"><circle cx="-18" cy="3" r="2.4"/><circle cx="20" cy="3" r="2.4"/></g>
      <path d="M-16 32q18 14 34 0" stroke="#1b2a3a" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>

    <!-- blueberry pentagon with stripes -->
    <g transform="translate(556 198) rotate(4)">
      <path d="M0-60 57-19 35 49-35 49-57-19Z" fill="url(#g-blue)"/>
      <g fill="#fff" opacity="0.75">
        <rect x="-44" y="-22" width="88" height="9" rx="4"/>
        <rect x="-44" y="2" width="88" height="9" rx="4"/>
        <rect x="-44" y="26" width="70" height="9" rx="4" transform="translate(9)"/>
      </g>
      <g fill="#fff"><circle cx="-17" cy="-2" r="13"/><circle cx="19" cy="-2" r="13"/></g>
      <g fill="#1b2a3a"><circle cx="-14" cy="1" r="6.4"/><circle cx="22" cy="1" r="6.4"/></g>
      <g fill="#fff"><circle cx="-17" cy="-3" r="2.3"/><circle cx="19" cy="-3" r="2.3"/></g>
      <ellipse cx="3" cy="26" rx="7" ry="9" fill="#1b2a3a" opacity="0.85"/>
    </g>

    <!-- grape star -->
    <g transform="translate(628 316) rotate(-10)">
      <path d="M0-56 17-19 56-15 27 11 35 50 0 31-35 50-27 11-56-15-17-19Z" fill="url(#g-grape)" stroke-linejoin="round" stroke="#7d54e8" stroke-width="6"/>
      <g fill="#fff"><circle cx="-14" cy="-2" r="11"/><circle cx="16" cy="-2" r="11"/></g>
      <g fill="#1b2a3a"><circle cx="-11" cy="1" r="5.4"/><circle cx="19" cy="1" r="5.4"/></g>
      <g fill="#fff"><circle cx="-13" cy="-2" r="2"/><circle cx="17" cy="-2" r="2"/></g>
      <path d="M-12 20q14 11 26 0" stroke="#1b2a3a" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- bubblegum triangle -->
    <g transform="translate(360 362) rotate(-4)">
      <path d="M0-54 56 34H-56Z" fill="url(#g-gum)" stroke="#e46bff" stroke-width="10" stroke-linejoin="round"/>
      <g fill="#fff"><circle cx="-16" cy="2" r="12"/><circle cx="16" cy="2" r="12"/></g>
      <g fill="#1b2a3a"><circle cx="-13" cy="5" r="5.8"/><circle cx="19" cy="5" r="5.8"/></g>
      <g fill="#fff"><circle cx="-15" cy="2" r="2.1"/><circle cx="17" cy="2" r="2.1"/></g>
      <path d="M-12 22q14 10 26 0" stroke="#1b2a3a" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- rainbow pearl -->
    <g transform="translate(492 372)">
      <circle r="44" fill="url(#pearl)"/>
      <g fill="none" stroke-width="7" opacity="0.85" stroke-linecap="round">
        <path d="M-32-14a34 34 0 0 1 24-22" stroke="#ff5f8f"/>
        <path d="M-4-40a34 34 0 0 1 32 16" stroke="#ffb02e"/>
        <path d="M32-8a34 34 0 0 1-10 32" stroke="#69d43f"/>
        <path d="M14 30a34 34 0 0 1-34-4" stroke="#3aa7ff"/>
      </g>
      <ellipse cx="-13" cy="-20" rx="15" ry="9" fill="#fff" opacity="0.9" transform="rotate(-24)"/>
    </g>
  </g>

  <!-- baby turtle swimming free -->
  <g transform="translate(680 116) rotate(-12)" filter="url(#drop)">
    <g fill="#12876a">
      <ellipse cx="-42" cy="-16" rx="18" ry="11" transform="rotate(-28 -42 -16)"/>
      <ellipse cx="-40" cy="22" rx="17" ry="10" transform="rotate(28 -40 22)"/>
      <ellipse cx="34" cy="20" rx="14" ry="9" transform="rotate(-24 34 20)"/>
    </g>
    <ellipse rx="46" ry="34" fill="url(#turtle)"/>
    <g fill="#0f7f60" opacity="0.55">
      <circle cx="-14" cy="-8" r="9"/><circle cx="12" cy="-10" r="8"/><circle cx="0" cy="12" r="9"/>
      <circle cx="-26" cy="10" r="7"/><circle cx="26" cy="8" r="7"/>
    </g>
    <g transform="translate(46 -14)">
      <circle r="19" fill="#8ef4cd"/>
      <g fill="#123"><circle cx="4" cy="-4" r="3.6"/><circle cx="13" cy="-3" r="3.2"/></g>
      <path d="M4 7q8 5 14-1" stroke="#123" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- egg resting in the sand -->
  <g transform="translate(120 404)">
    <ellipse cx="4" cy="42" rx="34" ry="9" fill="#00121f" opacity="0.25"/>
    <ellipse rx="30" ry="38" fill="#fdf1d8"/>
    <ellipse rx="30" ry="38" fill="none" stroke="#c9a978" stroke-width="3"/>
    <g fill="#c9a978" opacity="0.6">
      <circle cx="-10" cy="-12" r="4"/><circle cx="9" cy="-4" r="3.2"/><circle cx="-4" cy="14" r="3.6"/>
    </g>
    <ellipse cx="-9" cy="-16" rx="8" ry="5" fill="#fff" opacity="0.85" transform="rotate(-24 -9 -16)"/>
  </g>

  <!-- bubbles -->
  <g fill="none" stroke="#ffffff">
    <g opacity="0.55">
      <circle cx="96" cy="120" r="15" stroke-width="3"/>
      <circle cx="140" cy="72" r="9" stroke-width="2.5"/>
      <circle cx="240" cy="110" r="6" stroke-width="2"/>
      <circle cx="322" cy="56" r="11" stroke-width="2.5"/>
      <circle cx="470" cy="92" r="7" stroke-width="2"/>
      <circle cx="540" cy="52" r="13" stroke-width="3"/>
      <circle cx="736" cy="250" r="10" stroke-width="2.5"/>
      <circle cx="700" cy="330" r="6" stroke-width="2"/>
      <circle cx="64" cy="250" r="8" stroke-width="2.4"/>
    </g>
  </g>
  <g fill="#ffffff" opacity="0.32">
    <circle cx="92" cy="115" r="5"/><circle cx="537" cy="47" r="4"/><circle cx="318" cy="51" r="3.6"/>
  </g>

  <!-- foreground vignette -->
  <rect width="800" height="500" fill="none"/>
  <path d="M0 0h800v500H0z" fill="url(#ray)" opacity="0.06"/>
</svg>
